name: Build Argus (desktop app)

# Builds the operator desktop app for macOS, Windows, and Linux. PyInstaller
# can't cross-compile, so each OS builds its own artifact on its own runner.
#
# The test suite runs on EVERY push and PR. The build only runs on tags and
# manual dispatch, and only after the suite is green — a red suite must never
# be able to produce a signed installer.
on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    branches: [main]        # branch work is covered by its pull_request run
    tags: ["v*"]            # and a full build on every release tag
  pull_request:

# push used to fire on EVERY branch, so each PR push started two identical
# runs and the concurrency rule cancelled one — which GitHub renders with the
# same X as a failure. Every few days someone read "some checks failed" off a
# PR whose real runs were green (28 Aug, twice). One event per commit instead:
# PRs run as pull_request, main and tags run as push, and nothing needs
# cancelling in the normal path.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Everything downstream declares `needs: test`.
  # ---------------------------------------------------------------------------
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # The suite itself runs in ~10s; the rest is wheels. If this job is still
    # going after 20 minutes something is wedged, and failing fast beats holding
    # every PR behind a hung runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: same 2.8.0 pin, a fraction of the CUDA wheel's size.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchvision==0.23.0
          pip install -r requirements.txt
          pip install pytest
          # requirements.txt pins opencv-python, which links against libGL and
          # needs system packages a headless runner doesn't have. Swap it for the
          # headless build, which ships the same cv2 minus the GUI bindings the
          # tests never touch. Doing this with pip rather than apt-get: installing
          # system libs on the runner hung indefinitely on the apt lock, and this
          # job gates every PR.
          pip uninstall -y opencv-python
          pip install "opencv-python-headless==4.13.0.92"
          python -c "import cv2, numpy as np; ok, _ = cv2.imencode('.jpg', np.zeros((4,4,3), np.uint8)); assert ok; print('cv2', cv2.__version__, 'headless OK')"

      # `python -m pytest`, not `pytest` — the module form puts the repo root on
      # sys.path, which is how `import cvti` resolves without an install step.
      - name: Run tests
        run: python -m pytest -q

      # The headline precision figure is a function of prompt text in gate.py —
      # three revisions moved it 26 points. This does not re-measure (the VLM is
      # a 3 GB model this runner has no way to run); it enforces that the wording
      # and the recorded measurement agree, so a prompt change cannot ship
      # unmeasured.
      - name: Prompt regression guard
        run: python tools/prompt_regression.py check

  # The product, end to end, in containers: a real RTSP camera feeding the real
  # engine, with assertions on what came out. Runs on every push — this is the
  # test that would have caught the bugs humans found by running it. (25 Aug.)
  e2e:
    name: End-to-end (RTSP -> engine -> alerts)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the pipeline against a live RTSP stream
        run: |
          docker compose -f tests/e2e/docker-compose.yml up \
            --build --abort-on-container-exit --exit-code-from assert
      - name: Engine log on failure
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs engine | tail -80

  build:
    needs: [test, e2e]
    # Tags and manual runs only. A push to a branch gets the test job and stops
    # there; three OS runners per commit is not worth it.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: argus-macos
          - os: windows-latest
            artifact: argus-windows
          - os: ubuntu-latest
            artifact: argus-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt WebEngine needs a few system libs to even import on Linux runners.
      - name: Install Linux Qt/WebEngine runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 libxcb-cursor0 \
            libasound2t64 libxtst6 libxi6 libdrm2 libgbm1

      - name: Install build deps
        # The bundle now contains the ENGINE (EP-05-T1), so the build needs the
        # full detection stack — CPU torch keeps the wheels (and the installer)
        # a fraction of the CUDA size. GPU acceleration inside the bundle is a
        # deliberate non-goal at this stage: same behavior on every machine.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          pip install -r requirements.txt
          # The video-action model's deps live in their own file — and the
          # build never installed it, so PyInstaller could not bundle what
          # was not there: every Windows install shipped without transformers
          # and VideoMAE was dead on arrival (pilot screenshot, 4 Sep — the
          # v1.8.2 error finally NAMED the missing module).
          pip install -r requirements-video.txt
          pip uninstall -y opencv-python
          pip install pyinstaller PyQt6 PyQt6-WebEngine "opencv-python-headless==4.13.0.92"

      # Ship the AI runtime inside the bundle. Best-effort on Linux (zstd
      # availability varies); the mac/windows installers must carry it.
      - name: Fetch Ollama runtime (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch_ollama.sh || [ "$RUNNER_OS" = "Linux" ]
      - name: Fetch Ollama runtime (Windows)
        if: runner.os == 'Windows'
        run: scripts\fetch_ollama.bat
      - name: Fetch go2rtc gateway (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch_go2rtc.sh
      - name: Fetch go2rtc gateway (Windows)
        if: runner.os == 'Windows'
        run: scripts\fetch_go2rtc.bat
      # runs/ is gitignored, so a fresh CI checkout has NO VideoMAE weights —
      # the spec's conditional silently skipped them and every installer ever
      # built by CI shipped WITHOUT the video-action (theft) detector. Field
      # diagnostics (10 Sep) surfaced it: "video-action detector configured
      # but its model failed to load". The weights live on a non-v release tag
      # (weights-videomae-b0.889) precisely so this step can fetch them.
      - name: Fetch the VideoMAE video-action weights
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download weights-videomae-b0.889 --repo "$GITHUB_REPOSITORY"             --pattern "videomae-b0.889.zip" --output videomae.zip
          mkdir -p runs/video_finetune
          unzip -q videomae.zip -d runs/video_finetune
          test -f runs/video_finetune/videomae/model.safetensors
          rm videomae.zip

      - name: Fetch the open-vocab weights (YOLO-World + CLIP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download weights-openvocab-v1 --repo "$GITHUB_REPOSITORY"             --pattern "yolov8s-worldv2.pt" --output models/yolov8s-worldv2.pt
          mkdir -p vendor/clip
          gh release download weights-openvocab-v1 --repo "$GITHUB_REPOSITORY"             --pattern "ViT-B-32.pt" --output vendor/clip/ViT-B-32.pt
          test -f models/yolov8s-worldv2.pt && test -f vendor/clip/ViT-B-32.pt
          # the text-encoder package itself (pure python + BPE vocab data);
          # collect_all("clip") in the spec drags it into the bundle
          pip install "git+https://github.com/ultralytics/CLIP.git"

      - name: Export detectors to ONNX (W2)
        run: python scripts/export_onnx.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: python packaging/build.py --clean

      - name: Build (Windows/Linux)
        if: runner.os != 'macOS'
        run: python packaging/build.py --clean

      # ----- code signing (EP-05-T2) -----
      # Engages only when the secrets exist (docs/SIGNING.md). Without them the
      # build stays exactly what it was — unsigned — and says so, loudly.
      - name: Sign the app (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 not set — shipping UNSIGNED (docs/SIGNING.md)"
            exit 0
          fi
          echo "$CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci-tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-tmp build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-tmp build.keychain
          rm cert.p12
          codesign --deep --force --options runtime             --entitlements packaging/entitlements.plist             --sign "$SIGN_IDENTITY" "dist/Argus.app"
          codesign --verify --deep --strict "dist/Argus.app"

      # The shipped macOS disk image is now electron-builder's, so it is built
      # and notarised after the UI is packaged (further down). make_dmg.sh
      # wrapped the retired PyQt bundle and no longer runs.

      - name: Sign the executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) {
            Write-Host "::warning::WINDOWS_CERT_PFX not set — shipping UNSIGNED (docs/SIGNING.md)"
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1 -ExpandProperty FullName
          # Signed BEFORE electron-builder copies this tree into the app's
          # resources; it does not re-sign what it merely copies.
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist/Argus/Argus.exe" "dist/Argus/argus-engine.exe" "dist/Argus/argus-api.exe"
          Remove-Item cert.pfx

      # --help proves the bundle imports. It does NOT prove the product works,
      # and every bug that actually hurt this project got past it. These steps
      # RUN the shipped bundle against a real video source and assert the
      # artefacts a customer depends on. (25 Aug.)
      - name: Run the bundled engine for real (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Argus.app/Contents/MacOS/argus-engine" --help > /dev/null
          python tests/e2e/bundle_smoke.py "dist/Argus.app/Contents/MacOS/argus-engine"
      - name: Run the bundled engine for real (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/Argus/argus-engine --help > /dev/null
          python tests/e2e/bundle_smoke.py dist/Argus/argus-engine
      - name: Run the bundled engine for real (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/Argus/argus-engine.exe --help > /dev/null
          python tests/e2e/bundle_smoke.py dist/Argus/argus-engine.exe

      # The APP ITSELF must boot — engine checks below prove detection runs,
      # but Argus(.exe) had only ever been launched on developer laptops until
      # this step existed. Offscreen platform: no display on a runner.
      # Boot FROM A FOREIGN DIRECTORY on purpose: three field bugs in two days
      # were paths that only resolve when cwd is the repo/bundle. Booting from
      # $RUNNER_TEMP makes CI's environment as hostile as a Start-Menu launch.
      - name: Boot the shipped app (macOS)
        if: runner.os == 'macOS'
        env: { QT_QPA_PLATFORM: offscreen }
        run: cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/dist/Argus.app/Contents/MacOS/Argus" --smoke --db "$RUNNER_TEMP/smoke/events.db"
      # A background-only app can never take keyboard focus — v1.5.0 shipped
      # that way (PyInstaller stamps it when any bundled EXE is console=True)
      # and every keystroke fell through to the window behind Argus.
      - name: The app may take keyboard focus (macOS)
        if: runner.os == 'macOS'
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print :LSBackgroundOnly" "$GITHUB_WORKSPACE/dist/Argus.app/Contents/Info.plist" 2>/dev/null || echo "absent")
          echo "LSBackgroundOnly: $v"
          [ "$v" = "absent" ] || [ "$v" = "false" ] || { echo "::error::Argus.app is background-only — it can never accept typing"; exit 1; }
      - name: Boot the shipped app (Linux)
        if: runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/dist/Argus/Argus" --smoke --db "$RUNNER_TEMP/smoke/events.db"
      - name: Boot the shipped app (Windows)
        if: runner.os == 'Windows'
        env: { QT_QPA_PLATFORM: offscreen }
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\dist\Argus\Argus.exe" --smoke --db "$env:RUNNER_TEMP\smoke\events.db"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows specifically: prove the AI runtime SHIPPED and is launchable.
      # 'the ollama doesn't come in with it' (25 Aug) was a UX misreading, but
      # nothing in CI could have told us either way.
      - name: Assert the bundled AI runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python tests/e2e/bundle_runtime_check.py dist/Argus

      # ---------------------------------------------------------------------
      # The DESKTOP UI. Everything above builds and proves the ENGINE; this
      # builds the interface customers actually see and wraps the two into one
      # application. Until v1.8.13 nothing in this workflow mentioned the
      # frontend at all, so every release quietly shipped the old PyQt
      # interface while the React one existed only on developer machines.
      # ---------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build the desktop UI
        working-directory: Frontend
        run: |
          npm ci
          npm run build

      - name: Unit-test the desktop UI
        working-directory: Frontend
        run: npm test

      # electron-builder packages the shell and copies PyInstaller's whole
      # dist/Argus tree in as resources/engine (Frontend/electron-builder.yml).
      # Its NSIS target also produces the Windows installer, replacing the Inno
      # Setup script that installed the now-retired PyQt shell.
      - name: Package the desktop app
        working-directory: Frontend
        shell: bash
        env:
          # The release job owns publishing; electron-builder must never try.
          GH_TOKEN: ""
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) version="0.0.0" ;; esac
          # Signing engages only when the secrets exist, exactly like the steps
          # above; without them the build stays unsigned and says so, loudly.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MACOS_CERT_P12" ]; then
            echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            export CSC_LINK="$RUNNER_TEMP/cert.p12" CSC_KEY_PASSWORD="$MACOS_CERT_PASSWORD"
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERT_PFX" ]; then
            echo "$WINDOWS_CERT_PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            export CSC_LINK="$RUNNER_TEMP/cert.pfx" CSC_KEY_PASSWORD="$WINDOWS_CERT_PASSWORD"
          else
            echo "::warning::no signing certificate for $RUNNER_OS — the desktop app ships UNSIGNED (docs/SIGNING.md)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --config electron-builder.yml --publish never \
            -c.extraMetadata.version="$version"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pfx"
          ls -la release

      # The packaged app must contain BOTH halves. A shell without its engine
      # is a window that can never detect anything; an engine without the
      # renderer is what every release before v1.8.13 actually shipped.
      - name: Check the packaged app carries the UI and the engine
        shell: bash
        run: python tests/e2e/packaged_app_check.py Frontend/release

      - name: Notarise and staple the disk image (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          dmg="Frontend/release/argus-macos.dmg"
          if [ -z "$APPLE_ID" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "::warning::notarisation secrets not set — dmg will trigger Gatekeeper (docs/SIGNING.md)"
            exit 0
          fi
          codesign --force --sign "$SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$dmg"

      - name: Collect the artifacts
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in Frontend/release/*.dmg Frontend/release/*.zip Frontend/release/*.exe; do
            cp "$f" "$(basename "$f")"
          done
          ls -la *.dmg *.zip *.exe 2>/dev/null || true

      # GitHub refuses release assets >= 2 GiB — fail HERE, loudly, not in the
      # release job after three successful builds (v1.0.0 post-mortem, 23 Aug).
      - name: Enforce the release-asset size cap
        shell: bash
        run: |
          for f in ${{ matrix.artifact }}.dmg ${{ matrix.artifact }}.zip argus-windows-setup.exe; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f = $((size / 1024 / 1024)) MB"
            if [ "$size" -ge 2000000000 ]; then
              echo "::error::$f is over the 2 GiB GitHub release-asset cap — prune the bundle"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.zip
            argus-windows-setup.exe
          if-no-files-found: error
          # Scaffolding, not storage: the release job collects these minutes
          # later and the Releases page keeps the real assets forever. At the
          # default 90-day retention a week of builds hoarded 61.86 GB and
          # maxed the account's Actions storage the moment the repo went
          # private (30 Aug).
          retention-days: 1

  # On a version tag, collect all three OS builds into ONE public GitHub Release,
  # so the .dmg / .exe zip are downloadable straight from the Releases page (no
  # Actions login needed). Push a tag to trigger:  git tag v0.9.0 && git push origin v0.9.0
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Minimum expected of a security product's distribution: a downloader can
      # tell whether the file they got is the file we built. Not a substitute for
      # notarised signing — that lands with the installer rework.
      - name: Compute SHA-256 for every asset
        id: sums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo 'body<<SUMS_EOF'
            echo '## Verify your download'
            echo
            echo 'Run `shasum -a 256 <file>` (macOS/Linux) or'
            echo '`Get-FileHash <file> -Algorithm SHA256` (Windows) and compare:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo SUMS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.sums.outputs.body }}
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: false
