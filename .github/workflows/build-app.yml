name: Build CVTI Console (desktop app)

# Builds the operator desktop app for macOS, Windows, and Linux. PyInstaller
# can't cross-compile, so each OS builds its own artifact on its own runner.
#
# The test suite runs on EVERY push and PR. The build only runs on tags and
# manual dispatch, and only after the suite is green — a red suite must never
# be able to produce a signed installer.
on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    branches: ["**"]        # tests on every branch
    tags: ["v*"]            # and a full build on every release tag
  pull_request:

# A PR branch gets both a push event and a pull_request event. Keep the newest
# run per ref and cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Everything downstream declares `needs: test`.
  # ---------------------------------------------------------------------------
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # The suite itself runs in ~10s; the rest is wheels. If this job is still
    # going after 20 minutes something is wedged, and failing fast beats holding
    # every PR behind a hung runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: same 2.8.0 pin, a fraction of the CUDA wheel's size.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchvision==0.23.0
          pip install -r requirements.txt
          pip install pytest
          # requirements.txt pins opencv-python, which links against libGL and
          # needs system packages a headless runner doesn't have. Swap it for the
          # headless build, which ships the same cv2 minus the GUI bindings the
          # tests never touch. Doing this with pip rather than apt-get: installing
          # system libs on the runner hung indefinitely on the apt lock, and this
          # job gates every PR.
          pip uninstall -y opencv-python
          pip install "opencv-python-headless==4.13.0.92"
          python -c "import cv2, numpy as np; ok, _ = cv2.imencode('.jpg', np.zeros((4,4,3), np.uint8)); assert ok; print('cv2', cv2.__version__, 'headless OK')"

      # `python -m pytest`, not `pytest` — the module form puts the repo root on
      # sys.path, which is how `import cvti` resolves without an install step.
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    # Tags and manual runs only. A push to a branch gets the test job and stops
    # there; three OS runners per commit is not worth it.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: cvti-console-macos
          - os: windows-latest
            artifact: cvti-console-windows
          - os: ubuntu-latest
            artifact: cvti-console-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt WebEngine needs a few system libs to even import on Linux runners.
      - name: Install Linux Qt/WebEngine runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 libxcb-cursor0 \
            libasound2t64 libxtst6 libxi6 libdrm2 libgbm1

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine opencv-python-headless numpy

      - name: Build (macOS -> .app + .dmg)
        if: runner.os == 'macOS'
        run: python packaging/build.py --clean --dmg

      - name: Build (Windows/Linux)
        if: runner.os != 'macOS'
        run: python packaging/build.py --clean

      # macOS ships the .dmg directly; the other two ship a zipped onedir.
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: cp "dist/CVTI-Console.dmg" "${{ matrix.artifact }}.dmg"
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../${{ matrix.artifact }}.zip" .
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # On a version tag, collect all three OS builds into ONE public GitHub Release,
  # so the .dmg / .exe zip are downloadable straight from the Releases page (no
  # Actions login needed). Push a tag to trigger:  git tag v0.9.0 && git push origin v0.9.0
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Minimum expected of a security product's distribution: a downloader can
      # tell whether the file they got is the file we built. Not a substitute for
      # notarised signing — that lands with the installer rework.
      - name: Compute SHA-256 for every asset
        id: sums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo 'body<<SUMS_EOF'
            echo '## Verify your download'
            echo
            echo 'Run `shasum -a 256 <file>` (macOS/Linux) or'
            echo '`Get-FileHash <file> -Algorithm SHA256` (Windows) and compare:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo SUMS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.sums.outputs.body }}
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: false
