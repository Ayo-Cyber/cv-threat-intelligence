name: Build CVTI Console (desktop app)

# Builds the operator desktop app for macOS, Windows, and Linux. PyInstaller
# can't cross-compile, so each OS builds its own artifact on its own runner.
on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    tags: ["v*"]            # and on every release tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: cvti-console-macos
          - os: windows-latest
            artifact: cvti-console-windows
          - os: ubuntu-latest
            artifact: cvti-console-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt WebEngine needs a few system libs to even import on Linux runners.
      - name: Install Linux Qt/WebEngine runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 libxcb-cursor0 \
            libasound2t64 libxtst6 libxi6 libdrm2 libgbm1

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine opencv-python-headless numpy

      - name: Build (macOS -> .app + .dmg)
        if: runner.os == 'macOS'
        run: python packaging/build.py --clean --dmg

      - name: Build (Windows/Linux)
        if: runner.os != 'macOS'
        run: python packaging/build.py --clean

      # macOS ships the .dmg directly; the other two ship a zipped onedir.
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: cp "dist/CVTI-Console.dmg" "${{ matrix.artifact }}.dmg"
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../${{ matrix.artifact }}.zip" .
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
