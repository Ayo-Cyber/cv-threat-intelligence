# End-to-end: a real RTSP camera feeding the real engine (25 Aug).
#
#   docker compose -f tests/e2e/docker-compose.yml up --build --abort-on-container-exit
#
# `camera` publishes a looping clip over RTSP — the same protocol a customer's
# camera speaks, so the decoder, reconnect logic and frame publisher are all
# exercised for real rather than mocked. `engine` runs the product. `assert`
# waits for the artefacts and fails the run if the pipeline did not work.
services:
  rtsp:
    image: bluenviron/mediamtx:latest
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_RTSPADDRESS: :8554
    # No healthcheck: the image is minimal (no nc/curl), and probing it with a
    # shell is how this compose file failed the first time it ran. The camera
    # retries instead, and the ENGINE's own reconnect logic covers the rest —
    # which is a path worth exercising anyway.

  camera:
    image: linuxserver/ffmpeg:latest
    depends_on: [rtsp]
    volumes:
      - ../../data/test_clips:/clips:ro
    # This container must NEVER exit: --abort-on-container-exit tears the whole
    # stack down when any container stops, so ffmpeg's first attempt (before
    # mediamtx is listening) used to abort the run — the engine then found
    # nothing to decode and CI failed with DESCRIBE 404. It happened to pass
    # locally because the race resolved the other way. Retry forever instead.
    entrypoint: ["/bin/sh", "-c"]
    # LIST form, one element: compose shell-splits a string command, so
    # `sh -c` received only the word "while" and died instantly — which, with
    # --abort-on-container-exit, tore the stack down before the engine had even
    # loaded its models. Third attempt at this line; the shape matters.
    command:
      - "while true; do ffmpeg -re -stream_loop -1 -i /clips/crowd_01.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp:8554/cam1 || true; sleep 2; done"

  engine:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.engine
    depends_on: [rtsp, camera]
    volumes:
      - ./out:/out
      - ./site:/site:ro
    command: >
      --site-config /site/e2e_site.json
      --gate-provider local --gate-base-url http://127.0.0.1:59999/v1
      --target-fps 4 --imgsz 512 --seconds 900 --gate-drain 5
      --mobile-port 8710 --output-dir /out

  # The engine deliberately outlives the assertions (--seconds 900): with
  # --abort-on-container-exit, whichever container finishes FIRST tears the
  # stack down. On the first run the engine hit its 150s limit and killed the
  # assertions mid-flight (exit 137, which reads like a failure and is not).
  # The assertions must be the ones that finish first and decide the verdict.
  assert:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.engine
    depends_on: [engine]
    # Share the engine's network namespace ON PURPOSE. The frame publisher
    # binds 127.0.0.1 only — evidence must never be reachable off-box — so a
    # separate container CANNOT reach it, and the first run of this test proved
    # exactly that (connection refused from a sibling container). The assertion
    # therefore runs where the app runs: same host, loopback.
    network_mode: "service:engine"
    volumes:
      - ./out:/out
      - ../..:/repo:ro
    entrypoint: ["python", "/repo/tests/e2e/assert_pipeline.py", "/out"]
