# Retail-tuned BoT-SORT: appearance ReID re-matches a reappearing shopper to her
# original id (the main fix for id-switching). GMC off — store CCTV is a fixed camera.
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.50
track_buffer: 120
match_thresh: 0.80
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
