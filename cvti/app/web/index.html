<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Console</title>
<script>document.documentElement.setAttribute("data-mode","dark");</script>
<style>
  /* Tokens live on :root so the app shell (#cv) AND the sibling overlays
     (#wizard, #modalRoot) all inherit them. Theme is toggled on <html>. */
  :root{--c-bg:#0a1326;--c-panel:#0f1c36;--c-raised:#13223f;--c-border:#1f2c48;--c-border2:#2a3a5c;
    --c-text:#edf1f8;--c-mut:#8d94a6;--c-sub:#5f6b84;--c-accent:#36a0da;--c-accent-soft:rgba(54,160,218,0.15);
    --c-live:#22c55e;--c-feed:#060d1c;--sev-crit:#ef4444;--sev-high:#f59e0b;--sev-med:#fad881;--sev-low:#8d94a6;
    --ff-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ff-mono:ui-monospace,Menlo,"Cascadia Code",monospace;
    --focus:0 0 0 3px rgba(54,160,218,0.35)}
  :root[data-mode="light"]{--c-bg:#f5f6f8;--c-panel:#fff;--c-raised:#fff;--c-border:#e5e7eb;--c-border2:#c7cdd8;
    --c-text:#010916;--c-mut:#616161;--c-sub:#8d94a6;--c-accent:#298ec2;--c-accent-soft:#e7f3fa;--c-live:#16a34a;
    --c-feed:#0b1220;--sev-crit:#dc2626;--sev-high:#d97706;--sev-med:#ca8a04;--sev-low:#8d94a6}
  *{box-sizing:border-box}
  /* color + font on body so ALL top-level nodes (#cv, #wizard, #modalRoot)
     inherit them — not just #cv. Otherwise overlays fall back to black serif. */
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--ff-sans);font-size:13px}
  #cv{display:flex;height:100vh;min-height:640px;background:var(--c-bg);color:var(--c-text);
    font-family:var(--ff-sans);font-size:13px;overflow:hidden}
  .mono{font-family:var(--ff-mono)}
  button{font-family:inherit}
  nav{width:206px;flex:none;background:#0e1a34;display:flex;flex-direction:column;border-right:1px solid #1f2c48}
  :root[data-mode="light"] nav{background:#0c1930}
  .brand{padding:18px}
  .brand .n{font-size:21px;font-weight:700;color:#fff;letter-spacing:.02em}
  .brand .s{font-size:11px;color:#8d94a6;margin-top:2px}
  .navitems{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
  .navbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;
    border-radius:8px;font-weight:600;font-size:13px;color:#c7cdd8}
  .navbtn:hover{background:rgba(255,255,255,.06)}
  .navbtn.on{background:var(--c-accent-soft);color:#fff}
  .navbtn .badge{margin-left:auto;background:var(--sev-crit);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;text-align:center;padding:2px 5px;border-radius:99px;font-family:var(--ff-mono)}
  .navsec{margin:16px 12px 4px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-mut)}
  .navbtn.gear{margin-top:6px;font-size:12px;color:var(--c-sub)}
  .tabbar{display:flex;gap:4px}
  .tab{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 13px;border-radius:7px;font-size:11.5px;font-weight:600;
    color:var(--c-sub);border:1px solid transparent}
  .tab:hover{background:rgba(127,127,127,.09)}
  .tab.on{color:var(--c-text);background:var(--c-raised);border-color:var(--c-border2)}
  .navfoot{margin-top:auto;padding:14px 18px;border-top:1px solid #1f2c48;color:#5f6b84;font-size:11px}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.bar{flex:none;display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--c-border);
    background:var(--c-panel)}
  header.bar h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:12px;color:var(--c-mut)}
  .stats b{font-family:var(--ff-mono);color:var(--c-text);font-weight:500}
  .themebtn{all:unset;cursor:pointer;border:1px solid var(--c-border);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--c-mut)}
  #screen{flex:1;min-height:0;overflow:auto}
  .pad{padding:18px 24px 28px}
  h2{font-size:20px;font-weight:600;margin:0 0 4px}
  .mut{color:var(--c-mut)} .sub{color:var(--c-sub)}
  .panel{background:var(--c-panel);border:1px solid var(--c-border);border-radius:10px}
  .btn{all:unset;cursor:pointer;background:var(--c-accent);color:#fff;font-weight:700;padding:10px 18px;border-radius:8px;font-size:13px}
  .btn:focus-visible{box-shadow:var(--focus)}
  .btn.ghost{background:transparent;border:1px solid var(--c-border2);color:var(--c-text);font-weight:600}
  .btn.sm{padding:8px 14px;font-size:12.5px}
  input,select{background:var(--c-bg);border:1px solid var(--c-border2);color:var(--c-text);border-radius:8px;
    padding:9px 11px;font-family:var(--ff-sans);font-size:13px;outline:none}
  input:focus,select:focus{box-shadow:var(--focus);border-color:var(--c-accent)}
  input.mono{font-family:var(--ff-mono)}
  label.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{cursor:pointer;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--c-border2);
    color:var(--c-mut);background:transparent;user-select:none}
  .chip.on{border-color:var(--c-accent);color:#fff;background:var(--c-accent-soft)}
  /* cameras table */
  .thead,.trow{display:grid;grid-template-columns:150px 1fr 130px 200px 90px 70px;gap:12px;padding:11px 16px;align-items:center}
  .thead{border-bottom:1px solid var(--c-border);font-size:10.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--c-sub)}
  .trow{border-bottom:1px solid var(--c-border)}
  .trow:last-child{border-bottom:none}
  .dot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:6px}
  /* alerts */
  .alertswrap{display:flex;flex-direction:column;height:100%;min-height:0}
  .alerts{display:flex;flex:1;min-height:0}
  /* Ask your cameras */
  .askpad{max-width:960px}
  .askbar{display:flex;gap:10px;margin-top:6px}
  .askbar input{flex:1;font-size:15px;padding:12px 14px;border-radius:9px;border:1px solid var(--c-border2);
    background:var(--c-raised);color:var(--c-text)}
  .askbar input:focus{outline:none;border-color:var(--c-accent)}
  .askchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .askchip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--c-border2);
    background:transparent;color:var(--c-sub);cursor:pointer}
  .askchip:hover{border-color:var(--c-accent);color:var(--c-accent)}
  .askanswer{font-size:14.5px;margin:20px 0 6px;line-height:1.5}
  .askgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
  .askcard{border:1px solid var(--c-border);border-radius:10px;overflow:hidden;background:var(--c-raised)}
  .askcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .asknoimg{aspect-ratio:16/9;display:grid;place-items:center;color:var(--c-sub);background:var(--c-feed);font-size:12px}
  .askmeta{padding:11px 13px}
  /* Learning screen */
  .lhero{display:flex;align-items:center;gap:26px;padding:16px 20px;border:1px solid var(--c-border);border-radius:12px;
    background:linear-gradient(90deg,var(--c-raised),transparent);margin-bottom:14px}
  .lh-item{display:flex;flex-direction:column;gap:1px}
  .lh-n{font-family:var(--ff-mono);font-size:24px;font-weight:600;line-height:1;color:var(--c-text)}
  .lh-l{font-size:11px;color:var(--c-mut)}
  .lh-say{margin-left:auto;max-width:300px;text-align:right;font-size:12px;color:var(--c-sub);line-height:1.4}
  .lh-say b{color:var(--sev-crit)}
  .ldemote{font-size:12.5px;color:var(--c-sub);background:var(--c-raised);border:1px solid var(--c-border);
    border-radius:8px;padding:9px 13px;margin-bottom:12px}
  .lpanel{border:1px solid var(--c-border);border-radius:10px;overflow:hidden}
  .ltable{width:100%;border-collapse:collapse;font-size:13px}
  .ltable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-mut);
    padding:9px 12px;border-bottom:1px solid var(--c-border);background:var(--c-raised)}
  .ltable td{padding:9px 12px;border-bottom:1px solid var(--c-border)}
  .ltable tr:last-child td{border-bottom:none}
  .lbadge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid}
  /* alert sort toggle + threat-class colour coding */
  .asort{display:inline-flex;gap:2px;background:var(--c-raised);border-radius:7px;padding:2px}
  .asortb{all:unset;cursor:pointer;font-size:11px;font-weight:600;color:var(--c-mut);padding:4px 9px;border-radius:5px}
  .asortb.on{background:var(--c-accent-soft);color:var(--c-text)}
  .cchip{font-size:9.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid;flex:none}
  .agroup{padding:9px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .arow{border-left:3px solid transparent}
  /* feed-source toggle in the header */
  .feedtog{display:inline-flex;align-items:center;gap:3px;background:var(--c-raised);border-radius:8px;padding:3px 3px 3px 9px}
  .feedtog:empty{display:none}
  .feedlbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c-mut);margin-right:3px}
  .feedb{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--c-mut);padding:4px 10px;border-radius:6px}
  .feedb.on{background:var(--c-accent);color:#fff}
  .feedb:disabled{opacity:.5}
  /* Site map / floor plan */
  .floorplan{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;border:1px solid var(--c-border2);
    border-radius:14px;background:var(--c-raised);overflow:hidden}
  .fp-grid{position:absolute;inset:0;background-image:linear-gradient(var(--c-border) 1px,transparent 1px),linear-gradient(90deg,var(--c-border) 1px,transparent 1px);
    background-size:40px 40px;opacity:.4}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:1}
  .pindot{width:16px;height:16px;border-radius:99px;background:var(--c-live);box-shadow:0 0 0 4px rgba(34,197,94,.18);flex:none}
  .pindot.alert,.pin.alerting .pindot{background:var(--sev-crit);box-shadow:0 0 0 4px rgba(239,68,68,.25)}
  .pin.alerting{z-index:3}
  .pin.alerting .pindot{animation:pinpulse 1s infinite}
  @keyframes pinpulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.5),0 0 12px rgba(239,68,68,.6)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0),0 0 12px rgba(239,68,68,.9)}}
  .pinlabel{font-size:11px;font-weight:600;color:var(--c-text);background:var(--c-bg);padding:2px 8px;border-radius:99px;border:1px solid var(--c-border);white-space:nowrap}
  .pinalert{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--sev-crit);padding:3px 8px;border-radius:5px;
    text-transform:uppercase;display:none}
  .pin.alerting .pinalert{display:block}
  /* offline / local-only proof badge */
  .netbadge{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:6px;
    display:inline-block;border:1px solid var(--c-border2);color:var(--c-live)}
  .netbadge.offline{background:rgba(34,197,94,.14);border-color:var(--c-live);color:var(--c-live);animation:netflash .5s ease-out}
  @keyframes netflash{0%{transform:scale(1.08)}100%{transform:scale(1)}}
  /* detection -> verification timeline */
  /* subject shot: the boxed perpetrator */
  .subjwrap{margin-top:14px;border:1px solid var(--c-border);border-radius:10px;overflow:hidden;background:var(--c-raised)}
  .subjhead{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--sev-high);padding:9px 12px 7px}
  .subjimg{display:block;width:100%;max-height:280px;object-fit:contain;background:#000}
  .subjnote{font-size:11px;color:var(--c-mut);padding:7px 12px}
  .timeline{display:flex;align-items:center;gap:0;margin-top:16px;padding:12px 4px}
  .tl-step{display:flex;align-items:center;gap:9px}
  .tl-dot{width:11px;height:11px;border-radius:99px;background:var(--c-border2);flex:none;box-shadow:0 0 0 3px var(--c-raised)}
  .tl-dot.on{background:var(--c-live)}
  .tl-t{font-size:12.5px;font-weight:700;color:var(--c-text);white-space:nowrap}
  .tl-s{font-size:10.5px;color:var(--c-mut);white-space:nowrap}
  .tl-line{flex:1;height:2px;background:var(--c-border);position:relative;margin:0 10px;min-width:26px}
  .tl-lat{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--ff-mono);
    font-size:10px;color:var(--c-accent);background:var(--c-bg);padding:0 5px;white-space:nowrap}
  /* incident report modal */
  .report{background:#fff;color:#111;max-width:720px;width:92%;max-height:88vh;overflow:auto;border-radius:12px;
    margin:4vh auto;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .report .rhead{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:2px solid #111}
  .report .rbrand{font-size:20px;font-weight:800;letter-spacing:.02em}
  .report .rsev{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;padding:4px 12px;border-radius:5px}
  .report .rbody{padding:22px 26px}
  .report h3{margin:0 0 4px;font-size:19px}
  .report .rgrid{display:grid;grid-template-columns:120px 1fr;gap:6px 16px;margin:16px 0;font-size:13px}
  .report .rgrid .k{color:#666;font-weight:600}
  .report .rgrid .v{font-family:var(--ff-mono);color:#111}
  .report .rreason{background:#f4f5f7;border-left:3px solid #111;padding:12px 14px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
  .report .rframes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .report .rframes img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid #ddd}
  .report .rfoot{padding:14px 26px;border-top:1px solid #e3e3e3;display:flex;gap:10px;align-items:center;font-size:11px;color:#888}
  .reportmodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);overflow:auto}
  @media print{
    body.printing-report #cv,body.printing-report #wizard{display:none!important}
    body.printing-report .reportmodal{position:static;background:#fff;overflow:visible}
    body.printing-report .noprint{display:none!important}
    body.printing-report .report{box-shadow:none;margin:0;max-width:none;max-height:none}
  }
  .alist{width:390px;flex:none;border-right:1px solid var(--c-border);display:flex;flex-direction:column;min-height:0}
  .alist .scroll{flex:1;overflow:auto}
  .arow{display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--c-border)}
  .arow:hover{background:var(--c-raised)} .arow.sel{background:var(--c-raised);box-shadow:inset 3px 0 0 var(--c-accent)}
  .afilter{display:flex;flex-wrap:wrap;gap:3px;padding:9px 10px;border-bottom:1px solid var(--c-border);flex:none}
  .atab{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--c-mut);padding:5px 8px;border-radius:7px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .atab:hover{background:var(--c-raised)} .atab.on{background:var(--c-accent-soft);color:var(--c-text)}
  .acnt{font-family:var(--ff-mono);font-size:10.5px;background:var(--c-border);color:var(--c-mut);padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
  .atab.on .acnt{background:var(--c-accent);color:#fff}
  .adetail{flex:1;min-width:0;overflow:auto;padding:20px 26px}
  .sevbadge{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:5px;color:#fff}
  .frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .frames img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--c-border);background:var(--c-feed)}
  /* event clip player (auto-looping evidence frames) */
  .clipwrap{position:relative;margin-top:14px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--c-border);box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .clipwrap img,.clipwrap video{width:100%;height:100%;object-fit:contain;background:#000;display:block;transition:opacity .22s ease}
  .clipbadge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:6px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .clipbadge .dot{width:6px;height:6px;border-radius:99px;background:var(--sev-crit);animation:clippulse 1.4s ease-in-out infinite}
  @keyframes clippulse{0%,100%{opacity:1}50%{opacity:.35}}
  .clipcounter{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--ff-mono);
    font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
  .clipprog{position:absolute;left:0;bottom:0;height:3px;background:var(--c-accent);width:0;transition:width .22s linear}
  .clipstrip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
  .clipstrip img{height:50px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid var(--c-border);cursor:pointer;flex:none;opacity:.62;transition:opacity .15s ease,border-color .15s ease,transform .15s ease}
  .clipstrip img:hover{border-color:var(--c-accent);opacity:1}
  .clipstrip img.on{border-color:var(--c-accent);opacity:1;transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .snapwrap{position:relative;aspect-ratio:16/9;background:var(--c-feed);border-radius:10px;overflow:hidden;
    border:1px solid var(--c-border);display:flex;align-items:center;justify-content:center;color:var(--c-mut)}
  .snapwrap img{width:100%;height:100%;object-fit:cover}
  .spin{width:26px;height:26px;border-radius:99px;border:3px solid var(--c-border2);border-top-color:var(--c-accent);
    animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{max-width:460px;margin:70px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .kbd{font-family:var(--ff-mono);font-size:11px;color:var(--c-sub)}
  .confbar{flex:1;height:6px;background:var(--c-border);border-radius:99px;max-width:280px}
  .confbar>div{height:100%;border-radius:99px}
  .plabel{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c-mut)}
  /* setup: the model downloads while the user works (26 Aug) */
  .wizprep{margin-left:auto;display:flex;align-items:center;font-size:11.5px;color:var(--c-mut)}
  .prepbar{display:inline-block;width:90px;height:4px;border-radius:99px;background:var(--c-border);margin-left:9px;overflow:hidden}
  .prepbar>i{display:block;height:100%;background:var(--c-accent);transition:width .4s}
  /* EP-07-T4: measurement status where detectors are switched on */
  .valbadge{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.05em;vertical-align:1px}
  .valbadge.ok{color:var(--c-live);border:1px solid var(--c-live)}
  .valbadge.exp{color:var(--c-mut);border:1px dashed var(--c-mut)}
  /* §2.6: UNVERIFIED is never a severity colour — dashed grey, transparent fill */
  .unvpill{background:transparent !important;border:1.5px dashed var(--c-mut);color:var(--c-mut)}
  .arow.unvrow{opacity:.9}
  .audittbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .audittbl th{text-align:left;color:var(--c-mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px 4px 0}
  .audittbl td{padding:4px 8px 4px 0;border-top:1px solid var(--c-border);vertical-align:top}
  /* first-run wizard */
  #wizard{position:fixed;inset:0;z-index:50;background:var(--c-bg);display:none;flex-direction:column}
  #wizard.on{display:flex}
  #sceneReview{position:fixed;inset:0;z-index:65;background:var(--c-bg);display:none;grid-template-columns:260px minmax(0,1fr)}
  #sceneReview.on{display:grid}
  .srside{border-right:1px solid var(--c-border);padding:22px 14px;overflow:auto}
  .srmain{padding:24px;overflow:auto;min-width:0}
  .srarea{width:100%;text-align:left;padding:10px;border:0;border-radius:6px;background:transparent;color:var(--c-text);cursor:pointer}
  .srarea.on{background:var(--c-panel2);color:var(--c-accent)}
  .srcams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:16px 0}
  .srcam{border:1px solid var(--c-border);border-radius:6px;overflow:hidden;min-width:0}
  .srcam img,.srcam .srblank{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .srcam .srblank{display:grid;place-items:center;color:var(--c-mut)}
  @media(max-width:700px){#sceneReview.on{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.srside{border-right:0;border-bottom:1px solid var(--c-border);max-height:180px}.srmain{padding:16px}}
  .wizhead{flex:none;padding:20px 40px 0}
  .wizbrand{font-size:22px;font-weight:700;color:var(--c-text);letter-spacing:.02em}
  .steps{display:flex;gap:8px;margin-top:16px;align-items:center}
  .steps .st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--c-sub)}
  .steps .st .num{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;
    border:1px solid var(--c-border2);color:var(--c-sub)}
  .steps .st.on{color:var(--c-text)} .steps .st.on .num{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
  .steps .st.done .num{background:var(--c-live);border-color:var(--c-live);color:#fff}
  .steps .sep{flex:1;height:1px;background:var(--c-border);max-width:40px}
  .wizbody{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:28px 40px}
  .wizcard{width:100%;max-width:680px}
  .wizcard h2{font-size:26px;margin:0 0 6px} .wizcard .lead{color:var(--c-mut);font-size:14px;line-height:1.55;margin:0 0 20px}
  .wizfoot{flex:none;display:flex;gap:12px;align-items:center;padding:16px 40px;border-top:1px solid var(--c-border)}
  .wizfoot .spacer{flex:1}
  .found{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .found .ip{cursor:pointer;font-family:var(--ff-mono);font-size:12px;padding:6px 10px;border-radius:6px;
    border:1px solid var(--c-border2);color:var(--c-text)}
  .found .ip:hover{border-color:var(--c-accent);color:var(--c-accent)}
  .addedlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .addedcam{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--c-border);border-radius:8px}
  .statusbig{display:flex;align-items:center;gap:14px;padding:18px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-panel)}
  .statusdot{width:12px;height:12px;border-radius:99px;flex:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* live wall */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  /* Watch (UI_SPEC §2.2): the link-state row lives UNDER the tile, and an
     offline camera can never be a black tile — black is indistinguishable
     from a working camera watching a dark room. */
  .linkrow{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11.5px;font-family:var(--ff-mono)}
  .linkrow .lid{color:var(--c-text);font-weight:600}
  .linkrow .lst{margin-left:auto;color:var(--c-mut)}
  .linkrow .lst.crit{color:var(--sev-crit);font-weight:700}
  .linkrow .lst.warn{color:var(--sev-high);font-weight:600}
  .tile.offline{border:1.5px dashed var(--sev-crit);opacity:.55}
  .tile.offline img{visibility:hidden}
  .tile .nosignal{position:absolute;inset:0;display:grid;place-items:center;color:var(--c-mut);
    font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .tile .nosignal[hidden]{display:none}  /* author display beats UA [hidden] — same bug as .gatebanner */
  .offbanner{margin-top:14px;padding:13px 16px;border:1px solid var(--sev-crit);border-radius:10px;
    background:color-mix(in srgb, var(--sev-crit) 9%, transparent);display:flex;align-items:center;gap:12px}
  .offbanner b{color:var(--sev-crit)}
  /* Triage "Now" (UI_SPEC §2.3): one alert, one next action. */
  .nowwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:18px 24px;align-items:start}
  .sevpill{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.07em}
  .fstrip{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
  .fstrip img{width:92px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex:none}
  .fstrip img.on{border-color:var(--c-accent)}
  .nowmain img.hero{width:100%;border-radius:10px;display:block;background:var(--c-feed)}
  .allnormal{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:60px 30px;border:1px solid var(--c-border);border-radius:12px;background:var(--c-panel)}
  .thenrow{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--c-border);font-size:12px}
  .tile{position:relative;aspect-ratio:16/9;background:var(--c-feed);border:1px solid var(--c-border);
    border-radius:10px;overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--c-sub)}
  .tlabel{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:7px;font-size:12.5px;
    font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);font-family:var(--ff-mono)}
  .livedot{width:8px;height:8px;border-radius:99px;background:var(--c-live);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  /* a camera that's actively alerting */
  .tile.alerting{border-color:var(--alertcol,var(--sev-crit))!important;animation:alertpulse 1.1s infinite;z-index:1}
  @keyframes alertpulse{0%,100%{box-shadow:0 0 0 2px var(--alertcol,var(--sev-crit)),0 0 14px rgba(239,68,68,.35)}50%{box-shadow:0 0 0 2px var(--alertcol,var(--sev-crit)),0 0 26px rgba(239,68,68,.65)}}
  .tile.justfired{animation:alertpulse 1.1s infinite, tileflash .5s ease-out}
  @keyframes tileflash{0%{transform:scale(1.04);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}
  .talert{position:absolute;top:0;left:0;right:0;padding:9px 11px 16px;display:none;
    background:linear-gradient(180deg,rgba(220,38,38,.94),rgba(220,38,38,0))}
  .tile.alerting .talert{display:block}
  .talert .r{font-weight:800;font-size:12px;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .talert .why{font-size:11px;color:#fff;opacity:.95;margin-top:3px;line-height:1.3;max-height:2.7em;overflow:hidden}
  .tile.alerting .livedot{background:var(--sev-crit)}
  /* live tile zoom affordance + expand modal */
  .tzoom{position:absolute;top:8px;right:9px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.5);
    color:#fff;text-align:center;line-height:24px;font-size:13px;opacity:0;transition:opacity .12s;pointer-events:none}
  .tile:hover .tzoom{opacity:1}
  .livemodal{position:fixed;inset:0;background:rgba(4,8,18,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:36px}
  .livemodal-inner{position:relative;width:100%;max-width:1120px;aspect-ratio:16/9;background:#000;border-radius:12px;
    overflow:hidden;border:1px solid var(--c-border2);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .livemodal-inner img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .lmclose{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:99px;
    background:rgba(0,0,0,.6);color:#fff;text-align:center;line-height:34px;font-size:15px}
  .lmclose:hover{background:rgba(0,0,0,.85)}
  .lmlabel{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;color:#fff;
    font-family:var(--ff-mono);font-weight:600;font-size:14px;text-shadow:0 1px 4px #000}
  .lmalert{background:var(--sev-crit);color:#fff;padding:4px 10px;border-radius:6px;font-family:var(--ff-sans);font-size:12px;font-weight:700}
  /* rules page */
  .rulecard{padding:15px 17px;margin-bottom:12px}
  .detrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .detchip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
    padding:8px 12px;border-radius:9px;border:1px solid var(--c-border2);color:var(--c-mut);user-select:none;
    transition:border-color .12s ease,background .12s ease,transform .08s ease}
  .detchip:hover{border-color:var(--c-accent);transform:translateY(-1px)}
  .detchip:active{transform:translateY(0)}
  .detchip:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
  .detchip.on{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-text)}
  .detchip .di{font-size:13px;filter:grayscale(1);opacity:.55}
  .detchip.on .di{filter:none;opacity:1}
  .detchip .dt{font-size:10px;color:var(--c-sub);margin-left:1px}
  .detchip.on .dt{color:var(--c-accent)}
  /* detector groups: Security vs Safety/HSE */
  .detgroup{margin-top:12px}
  .detghead{display:flex;align-items:baseline;gap:9px;font-size:12px}
  .detghead b{font-size:12px;letter-spacing:.02em}
  .detghead .mut{font-size:11px}
  .detgcount{margin-left:auto;font-family:var(--ff-mono);font-size:10.5px;font-weight:600;color:var(--c-mut);
    background:var(--c-raised);border-radius:99px;padding:1px 8px}
  .detgcount.on{background:var(--c-accent);color:#fff}
  /* scene context + custom threats */
  .scenehint{font-size:12px;color:var(--c-mut);margin-top:10px;padding:9px 11px;background:var(--c-bg);
    border-radius:8px;border:1px solid var(--c-border);line-height:1.45}
  .envtag{display:inline-block;font-family:var(--ff-mono);font-size:10px;font-weight:700;color:var(--c-accent);
    background:var(--c-accent-soft);padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;margin-right:8px}
  .scenemap{margin-top:12px;padding:12px 0;border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border)}
  .scenemap-head{display:flex;align-items:center;gap:9px;min-height:28px}
  .mapping-status{font-family:var(--ff-mono);font-size:10px;font-weight:700;text-transform:uppercase;
    color:var(--c-sub);border:1px solid var(--c-border2);border-radius:5px;padding:2px 7px}
  .mapping-status.reviewed{color:var(--c-live);border-color:rgba(70,190,120,.45)}
  .mapping-status.failed,.mapping-status.stale{color:var(--sev-high);border-color:rgba(255,160,40,.5)}
  .scenemap-grid{display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
  .scene-frame{width:100%;aspect-ratio:16/10;object-fit:contain;background:#000;border:1px solid var(--c-border);border-radius:6px}
  .scene-fields{display:grid;grid-template-columns:minmax(150px,.7fr) minmax(220px,1.3fr);gap:8px}
  .scene-fields label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--c-mut)}
  .scene-fields .wide{grid-column:1/-1}
  .scene-fields textarea{min-height:58px;resize:vertical}
  .scene-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
  .scene-suggestions{margin-top:9px;display:grid;gap:5px}
  .scene-suggestion{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 0;border-top:1px solid var(--c-border)}
  @media(max-width:760px){.scenemap-grid{grid-template-columns:1fr}.scene-frame{max-width:240px}.scene-fields{grid-template-columns:1fr}}
  .customthreat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;
    border:1px solid var(--c-border);border-radius:8px;margin-top:6px;font-size:12.5px}
  .customthreat b{font-weight:700}
  /* zone drawing modal */
  .zonemodal{position:fixed;inset:0;background:rgba(4,8,18,.9);z-index:70;display:flex;align-items:center;justify-content:center;padding:30px}
  .zonemodal-inner{background:var(--c-panel);border:1px solid var(--c-border2);border-radius:12px;padding:18px 20px;max-width:800px;width:100%}
  .zmhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}
  .zmcanvaswrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--c-border);margin:0 auto;background:#000}
  .zmcanvaswrap img{display:block}
  .zmcanvaswrap canvas{position:absolute;top:0;left:0;cursor:crosshair}
  /* value screen */
  .vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
  .vcard{border:1px solid var(--c-border);border-radius:12px;padding:15px 17px;background:var(--c-panel)}
  .vcard .n{font-family:var(--ff-mono);font-size:30px;font-weight:600;line-height:1.05;color:var(--c-text)}
  .vcard .l{font-size:12px;color:var(--c-sub);margin-top:5px;font-weight:600}
  .vcard .t{font-size:11px;color:var(--c-mut);margin-top:6px;line-height:1.45}
  .vcompare{display:flex;align-items:stretch;gap:0;border:1px solid var(--c-border);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .vside{flex:1;padding:17px 20px}
  .vside.raw{background:rgba(220,70,70,.07)}
  .vside.kept{background:rgba(70,190,120,.07)}
  .vside .n{font-family:var(--ff-mono);font-size:34px;font-weight:600;line-height:1}
  .vside.raw .n{color:var(--sev-crit)}
  .vside.kept .n{color:var(--c-live)}
  .vside .l{font-size:12.5px;color:var(--c-sub);margin-top:6px}
  .varrow{display:flex;align-items:center;padding:0 14px;color:var(--c-mut);font-size:20px}
  .vinputs{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .vinputs label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--c-mut)}
  .vinputs input{width:130px}
  /* auth gate (UI_SPEC §2.2) */
  #authGate{position:fixed;inset:0;background:var(--c-bg);z-index:80;display:none;align-items:center;justify-content:center}
  #authGate.on{display:flex}
  .authbox{width:440px;max-width:92vw}
  .authbox .brand-n{font-size:24px;font-weight:700;letter-spacing:-.3px}
  .authbox .field{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--c-border2);border-radius:8px;
    background:var(--c-bg);color:var(--c-text);font-family:var(--ff-mono);font-size:13px}
  .authbox .field:focus{outline:none;border-color:var(--c-accent);box-shadow:var(--focus)}
  .authbox .flabel{font-size:11px;color:var(--c-sub);margin-top:13px}
  .authbox .ferr{color:var(--sev-crit);font-size:12px;margin-top:10px;min-height:15px}
  .authdots{display:flex;gap:5px;margin-top:16px}
  .authdots div{height:3px;flex:1;border-radius:2px;background:var(--c-border2)}
  .authdots div.on{background:var(--c-accent)}
  /* gate banner — the app is running unverified, and must never hide it */
  .gatebanner{background:var(--sev-crit);color:#fff;font-weight:700;letter-spacing:.4px;
    padding:9px 22px;font-size:13px;display:flex;gap:10px;align-items:center}
  /* author display:flex beats the UA's [hidden]{display:none} — restate it,
     or the banner renders as an empty red strip whenever it is "hidden". */
  .gatebanner[hidden]{display:none}
  .gatebanner .sub{font-weight:500;opacity:.9;letter-spacing:0}
  /* system page */
  .syslabel{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c-sub)}
  .sysnotifies{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .sysnotify{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:8px;cursor:pointer}
  .sysnotify:hover{background:var(--c-raised)}
  .sysnotify input{width:16px;height:16px;flex:none}
</style>
</head>
<body>
<div id="cv" data-mode="dark">
  <nav>
    <div class="brand"><div class="n">Argus</div><div class="s" id="siteName">Site 01 · local</div></div>
    <div class="navitems" id="nav"></div>
    <div class="navfoot">
      <div class="row" style="gap:8px"><span class="dot" id="monDot" style="background:var(--c-sub)"></span>
        <span id="monLabel" style="font-weight:600;color:#c7cdd8">Idle</span></div>
      <div class="mono" id="liveLine" style="margin-top:6px;font-size:11px;color:var(--c-mut)">○ not monitoring</div>
      <div class="mono" id="monGate" style="margin-top:6px">TrueSight · on-device</div>
      <div class="netbadge" id="netBadge" title="Argus runs entirely on this machine — it needs no internet, and nothing leaves your network">🔒 Local-only</div>
      <div class="mono" id="whoami" style="margin-top:8px;color:var(--c-mut);font-size:11px;display:none">
        <span id="whoamiName"></span> <a href="#" onclick="doSignOut();return false" style="color:var(--c-sub);margin-left:6px">sign out</a></div>
      <div style="margin-top:4px;color:#3d4a66" id="appVer">Argus</div>
    </div>
  </nav>
  <main>
    <div id="gateBanner" class="gatebanner" hidden></div>
    <header class="bar">
      <h1 id="title">Watch</h1>
      <div id="tabs" class="tabbar"></div>
      <div class="stats">
        <span class="mono" id="queueLine" style="font-size:11px;color:var(--c-mut)"></span>
        <span class="mono" id="engineLine" style="font-size:11px;color:var(--c-mut)"></span>
        <span><b id="stCams">0</b> cameras</span>
        <span><b id="stPending">0</b> to review</span>
        <span class="feedtog" id="feedTog"></span>
        <button class="btn sm" id="monBtn" onclick="toggleMonitor()">▶ Start monitoring</button>
        <button class="themebtn" onclick="toggleTheme()">◐ theme</button>
      </div>
    </header>
    <div id="screen"><div class="pad mut">Loading…</div></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="wizard"></div>
<div id="sceneReview"></div>
<!-- Pre-opened ON PURPOSE: the console shell paints instantly, but the
     bridge + authState round-trip decides whether this user may see it. The
     gate used to start hidden, so every launch flashed the full app before
     the sign-in snapped over it — on a cold Windows start, for seconds
     ("the first page should be sign in or create an account", 28 Aug).
     boot() swaps this splash for create-owner / sign-in, or clears it. -->
<div id="authGate" class="on"><div class="authbox">
  <div class="brand-n">Argus</div>
  <div class="mut" style="margin-top:6px">Starting&hellip;</div>
</div></div>

<script>
"use strict";
var backend = null, state = {route:"watch", cameras:[], events:[], selected:null, presets:{}, test:null, scanHosts:[], sceneContexts:{}};
/* Three surfaces (UI_SPEC §1): Watch / Triage / Configure. Value sits in an
   owner section; Settings hides behind a gear. Every old screen survives as a
   tab inside one of these — LEGACY_ROUTES maps old names so nothing 404s. */
var NAV = [["watch","Watch"],["triage","Triage"],["configure","Configure"]];
var LEGACY_ROUTES = {cameras:["configure","cameras"], rules:["configure","rules"],
                     alerts:["triage","alerts"], live:["watch","grid"],
                     map:["watch","floor"], ask:["watch","ask"],
                     learning:["settings","learning"], system:["settings","system"]};
var SURFACE_TABS = {watch:[["grid","Grid"],["floor","Floor plan"],["ask","Ask"]],
                    configure:[["cameras","Cameras"],["rules","Rules"]],
                    settings:[["system","System"],["learning","Learning"]],
                    triage:[["now","Now"],["alerts","All alerts"]], value:[]};
var SEV = {critical:"var(--sev-crit)",high:"var(--sev-high)",medium:"var(--sev-med)",low:"var(--sev-low)"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(id){return document.getElementById(id);}
function call(method, args, cb){ // args: array; cb(obj)
  if(!backend){cb&&cb({error:"backend not connected"});return;}
  var f = backend[method];
  var done = function(json){ try{cb&&cb(JSON.parse(json));}catch(e){cb&&cb({error:"bad response"});} };
  f.apply(backend, (args||[]).concat([done]));
}

function renderNav(){
  var html = NAV.filter(function(n){ return navAllowed(n[0]); }).map(function(n){
    var on = state.route===n[0] ? " on" : "";
    var badge = (n[0]==="triage" && state.pending>0) ? '<span class="badge">'+state.pending+'</span>' : '';
    return '<button class="navbtn'+on+'" onclick="go(\''+n[0]+'\')">'+n[1]+badge+'</button>';
  }).join("");
  if(navAllowed("value"))

/* ---------- monitoring engine control ---------- */
function refreshMonitor(){ call("monitoringStatus",[],function(s){
  applyMonitor(s && s.running);
  /* Warm-up is its own state now: the engine's first heartbeat names its
     phase, so a slow first start reads "Starting…" — never "engine not
     running" under a green Monitoring dot (field screenshot, 1 Sep). */
  if(s && s.running && s.starting){
    var sdot=$("monDot"), slab=$("monLabel"), sg=$("monGate");
    if(sdot) sdot.style.background="var(--sev-high)";
    if(slab) slab.textContent="Starting…";
    if(sg) sg.textContent=s.phase||"engine starting…";
  }
  state.engineFail = (s && !s.running && s.exit_code!=null)
    ? {code:s.exit_code, why:s.last_error||"", log:s.log_path||"", gaveUp:!!s.gave_up} : null;
  /* A crash LOOP looks alive at almost every poll — the watchdog respawns
     faster than the UI samples. Surfacing restarts is the only honest state
     for it (pilot screenshot, 29 Aug: 'Stop monitoring' over an engine that
     had died four times, no reason ever shown). */
  state.engineLoop = (s && s.crash_looping)
    ? {n:s.restarts, code:s.last_exit_code, why:s.last_error||"", log:s.log_path||""} : null;
  var g=$("monGate");
  if(g && state.engineLoop){
    g.textContent = "engine is crash-looping ("+state.engineLoop.n+" restarts)"
      +(state.engineLoop.why ? " — "+state.engineLoop.why.slice(0,70) : "");
    g.title = (state.engineLoop.why||"") + (state.engineLoop.log ? "\nlog: "+state.engineLoop.log : "");
  } else if(g && state.engineFail){
    g.textContent = "engine exited (code "+state.engineFail.code+")"
      +(state.engineFail.why ? " — "+state.engineFail.why.slice(0,80) : "");
    g.title = (state.engineFail.why||"") + (state.engineFail.log ? "\nlog: "+state.engineFail.log : "");
  }
}); }
function applyMonitor(running){
  state.monitoring = !!running;
  var b=$("monBtn"); if(b){ b.textContent = running ? "■ Stop monitoring" : "▶ Start monitoring";
    b.className = running ? "btn sm" : "btn ghost sm"; }
  var dot=$("monDot"), lab=$("monLabel");
  if(dot) dot.style.background = running ? "var(--c-live)" : "var(--c-sub)";
  if(lab) lab.textContent = running ? "Monitoring" : "Idle";
}
function toggleMonitor(){
  var b=$("monBtn"); if(b){ b.textContent="…"; }
  if(state.monitoring){ call("stopMonitoring",[],function(){ refreshMonitor(); }); }
  else { call("startMonitoring",[],function(r){ applyMonitor(true);
    // engine takes ~15-30s to load models; alerts start flowing after that
    if($("monGate")) $("monGate").textContent="TrueSight · loading models…";
    // The optimistic flip lied on a machine whose engine died at startup:
    // the button said "Stop monitoring" over a footer saying "engine not
    // running" (field screenshot, 29 Aug). Reconcile with the polled truth
    // while a first start is still believably warming up.
    setTimeout(refreshMonitor, 5000);
    setTimeout(refreshMonitor, 15000);
    // NO timer-based liveness: the footer declared the AI live on a machine
    // whose gate was stamping every alert UNVERIFIED (pilot, 29 Aug) — the
    // string fired 25s after the click, model or no model. pollGateHealth
    // owns this line now, from the gate's real health.
  }); }
}

/* Switching is ASYNC: the backend returns at once and works in the background
   (resolving live URLs + restarting the engine takes many seconds). We poll for
   progress so the window never freezes. */
function switchFeed(key){
  var el=$("feedTog"); if(el) el.querySelectorAll(".feedb").forEach(function(b){b.disabled=true;});
  setFeedStatus("switching feed…");
  call("switchFeed",[key],function(r){
    if(r && r.error){ finishSwitch({error:r.error}); return; }
    pollFeedSwitch(0);
  });

function setFeedStatus(txt){ var g=$("monGate"); if(g) g.textContent=txt; }
function pollFeedSwitch(n){
  if(n>150){ finishSwitch({error:"timed out"}); return; }        // ~2.5 min ceiling
  call("feedSwitchStatus",[],function(s){
    if(!s || s.error){ finishSwitch({error:(s&&s.error)||"failed"}); return; }
    if(s.busy){ setFeedStatus(s.status||"switching…"); setTimeout(function(){ pollFeedSwitch(n+1); },1000); return; }
    finishSwitch(s);
  });

function finishSwitch(s){
  var el=$("feedTog"); if(el) el.querySelectorAll(".feedb").forEach(function(b){b.disabled=false;});
  refreshFeedToggle();
  setFeedStatus(s && s.error ? ("switch failed: "+s.error)
    : ("feed: "+(s.active||"")+(s.engine_restarted?" · engine restarting":"")));
  refreshCounts(); refreshMonitor();
  if(state.route==="watch" && (state.watchTab||"grid")==="grid"){ stopLive(); render(); }
  else if(state.route==="triage"){ state.alertsSig=""; render(); }
  else render();
}

function render(){
  /* Stale-callback guard: every navigation bumps this token; any async
     callback that wants to paint $("screen") must still hold the current
     token. Kills the whole class of "slow response overwrites the screen
     you navigated to" bugs (audit findings 1-3,5, 23 Aug). */
  state.renderToken = (state.renderToken||0) + 1;
  var t = {watch:"Watch",triage:"Triage",configure:"Configure",settings:"Settings",value:"Value"}[state.route]||"Argus";
  $("title").textContent = t;
  renderTabs();
  if(state.route==="watch"){
    var v=state.watchTab||"grid";
    if(v==="floor") return renderMap();
    if(v==="ask")   return renderAsk();
    return renderLive();
  }
  if(state.route==="triage"){
    if((state.triageTab||"now")==="now") return renderNow();
    refreshTriage(); return renderAlerts();
  }
  if(state.route==="configure"){
    return (state.configureTab||"cameras")==="rules" ? renderRules() : renderCameras();
  }
  if(state.route==="settings"){
    return (state.settingsTab||"system")==="learning" ? renderLearning() : renderSystem();
  }
  if(state.route==="value") return renderValue();
  $("screen").innerHTML='<div class="pad"><h2>'+t+'</h2><p class="mut">Coming soon.</p></div>';
}

/* Link state as OBSERVED, never inferred. "configured" used to show a green dot
   whether or not the camera was reachable — and an unreachable camera raises no
   alerts, which looks exactly like a quiet corridor. False confidence is worse
   than visible failure. */
var LINK_UI = {
  connected:    ["var(--c-live)",  "live"],
  reconnecting: ["var(--sev-high)","reconnecting"],
  offline:      ["var(--sev-crit)","OFFLINE"],
  unknown:      ["var(--c-sub)",   "not monitoring"]
};
function linkCell(link){
  var st = (link && link.state) || "unknown";
  var ui = LINK_UI[st] || LINK_UI.unknown;
  /* Liveness is the age of the last FRAME, not of the connection state — a
     connected camera whose frames stopped is exactly the ambiguity to remove. */
  var age = "";
  if(link && st==="connected" && link.last_frame_age_s!=null) age = " · frame "+fmtAge(link.last_frame_age_s)+" ago";
  else if(link && link.time_in_state) age = " · "+fmtAge(link.time_in_state);
  var rc = link && link.reconnects ? ' <span class="mut" title="reconnections">↻'+link.reconnects+'</span>' : "";
  /* Adaptive ingest (3 Sep): when THIS machine can't keep up with the
     camera's stream, say the numbers and the fix — a slow wall with no
     explanation reads as a broken product. */
  var ing = link && link.ingest;
  var ingest = "";
  if(ing && ing.width){
    var res = ing.width+"×"+ing.height+(ing.source_fps?("@"+Math.round(ing.source_fps)):"");
    ingest = ing.limited
      ? '<div style="font-size:10.5px;color:var(--sev-high)" title="This machine cannot decode this stream at full rate. Use the camera\'s lower-resolution substream to restore it.">'
        + esc(res)+' · machine-limited, sampling '+esc(String(ing.sampling_fps))+'fps</div>'
      : '<div class="mut" style="font-size:10.5px">'+esc(res)+' · sampling '+esc(String(ing.sampling_fps))+'fps</div>';
  }
  return '<span><span class="dot" style="background:'+ui[0]+'"></span>'
    + '<span style="color:'+ui[0]+'">'+esc(ui[1])+'</span>'
    + '<span class="mut" style="font-size:11px">'+esc(age)+'</span>'+rc+ingest+'</span>';
}
function fmtAge(sec){

/* ---------- Live wall ---------- */
function streamUrl(camId){
  /* MJPEG: one long-lived connection the browser decodes natively. No JS in
     the render loop, no per-frame request. (26 Aug: the 90ms poll was the
     sluggish wall.) */
  var tok = state.frameToken ? "&token="+encodeURIComponent(state.frameToken) : "";
  return "http://127.0.0.1:"+state.livePort+"/stream/"+encodeURIComponent(camId)+"?s=1"+tok;
}
function frameUrl(camId){
  /* The frame endpoint authenticates every route. An <img> tag cannot set a
     header, so the capability travels as a query parameter — it binds to
     127.0.0.1 and never leaves this machine. */
  var tok = state.frameToken ? "&token="+encodeURIComponent(state.frameToken) : "";
  return "http://127.0.0.1:"+state.livePort+"/frame/"+encodeURIComponent(camId)
    +"?t="+(state.frameTick||0)+tok;
}

var LIVE_ALERT_WINDOW = 8;   // seconds a tile shows its label after an event, then it clears
function updateLiveAlertTiles(){
  var nowS = Date.now()/1000;
  var active = {};   // camera -> its most RECENT event
  (state.latestEvents||[]).forEach(function(e){
    if(!active[e.camera_id] || (e.ts||0) > (active[e.camera_id].ts||0)) active[e.camera_id]=e; });
  var wall = document.querySelector(".wall");
  var prev = state._alertingCams || {};
  var now = {};
  (state.liveCams||[]).forEach(function(c){
    var tile=$("tile-"+c.id), ov=$("talert-"+c.id), a=active[c.id];
    if(!tile) return;
    // Only show the label while the event is HAPPENING (fresh); once recorded it
    // leaves, and only returns when another event fires on this camera.
    var fresh = a && (nowS - (a.ts||0) < LIVE_ALERT_WINDOW);
    if(fresh){
      now[c.id]=true;
      tile.classList.add("alerting");
      // colour the ring by severity (critical stays red; high = amber)
      tile.style.setProperty("--alertcol", SEV[a.priority]||SEV.critical);
      if(ov) ov.innerHTML='<div class="r">⚠ '+esc(a.rule)+'</div><div class="why">'+esc(a.reason||"")+'</div>';
      if(!prev[c.id] && wall){                 // NEW fire this cycle
        wall.insertBefore(tile, wall.firstChild);   // jump to the front of the wall
        tile.classList.remove("justfired"); void tile.offsetWidth;   // restart the flash
        tile.classList.add("justfired");
      }
    } else {
      tile.classList.remove("alerting","justfired"); tile.style.removeProperty("--alertcol");
      if(ov) ov.innerHTML="";
    }
  });
  state._alertingCams = now;
}
function startLivePoll(){ stopLivePoll(); state.liveTimer = setInterval(function(){
  if(!(state.route==="watch" && (state.watchTab||"grid")==="grid") && !state.liveModal){ stopLive(); return; }
  state.frameTick = (state.frameTick||0) + 1;
  // Tiles are MJPEG streams now — the browser pushes them; we only watch for
  // a dead stream so the self-heal can re-resolve port+token.
  var broken = 0;
  (state.liveCams||[]).forEach(function(c){ var img=$("live-"+c.id);
    if(img && img.complete && img.naturalWidth===0) broken++; });
  if(state.liveModal){ updateLiveModalLabel(); }   // the modal streams too
  /* Self-heal (the always-NO-SIGNAL bug): every engine restart mints a new
     frame port + token, and a cached pair goes stale forever. If every tile
     is failing, re-resolve — at most once per 5s so a dead engine can't
     make this loop. */
  if(broken && broken >= (state.liveCams||[]).length){
    var now = Date.now();
    if(!state.frameHealAt || now - state.frameHealAt > 5000){
      state.frameHealAt = now;
      call("liveStart",[6],function(res){
        if(res && res.port){ state.livePort=res.port; state.frameToken=res.token||"";
          /* Re-resolving the port was never enough. This healed the STATE and
             left the tiles holding their old src, so the wall stayed black
             after every engine restart while zooming a tile worked — the
             modal builds a fresh <img> from the healed state. Repaint the
             tiles that are actually stale; leave the healthy ones connected
             so one dead camera cannot restart the whole wall. */
          repointLive(); }
      });
    }
  }
}, 500); }   // the wall streams itself; this tick only watches health
function repointLive(){
  var want = "127.0.0.1:"+state.livePort+"/", cache = "&r="+Date.now();
  (state.liveCams||[]).forEach(function(c){
    var img=$("live-"+c.id); if(!img) return;
    var stale = (img.getAttribute("src")||"").indexOf(want) < 0;
    var dead  = img.complete && img.naturalWidth===0;
    if(stale || dead) img.src = streamUrl(c.id)+cache;
  });
  if(state.liveModal){ var m=$("lmimg"); if(m) m.src = streamUrl(state.liveModal)+cache; }
}

/* Watch link-state (UI_SPEC §2.2): dot · id · state under every tile, dashed
   dimmed tile + banner when a camera is offline past grace, and the engine
   truth line in the top bar — "Engine not running" when health is stale,
   never a silent nothing. */
function fmtDur(sec){ sec=Math.max(0,Math.round(sec||0));
  if(sec<60) return sec+"s"; if(sec<3600) return Math.round(sec/60)+"m"; return (sec/3600).toFixed(1)+"h"; }
function refreshWatchState(){
  call("cameraLinks",[],function(links){
    if(!Array.isArray(links)) links=[];
    var offline=[];
    links.forEach(function(l){
      var row=$("link-"+l.camera_id); var tile=$("tile-"+l.camera_id); var ns=$("nosig-"+l.camera_id);
      var st=l.state||"unknown";
      if(row){
        var dot=row.querySelector(".dot"), lab=row.querySelector(".lst");
        if(st==="connected"){ dot.style.background="var(--c-live)"; lab.className="lst"; lab.textContent="live · "+fmtDur(l.time_in_state); }
        else if(st==="reconnecting"){ dot.style.background="var(--sev-high)"; lab.className="lst warn"; lab.textContent="reconnecting · "+(l.reconnects||0)+" attempts"; }
        else if(st==="offline"){ dot.style.background="var(--sev-crit)"; lab.className="lst crit"; lab.textContent="OFFLINE "+fmtDur(l.time_in_state); }
        else { dot.style.background="var(--c-sub)"; lab.className="lst"; lab.textContent="not monitoring"; }
      }
      if(tile){ tile.classList.toggle("offline", st==="offline"); if(ns) ns.hidden = st!=="offline"; }
      if(st==="offline") offline.push(l);
    });
    var b=$("offBanner");
    if(b){
      b.innerHTML = offline.map(function(l){
        return '<div class="offbanner"><span><b>'+esc(l.camera_id)+'</b> has been unreachable for '
          +fmtDur(l.time_in_state)+'. Reconnecting — '+(l.reconnects||0)+' attempts. '
          +'<b>Nothing is being watched there.</b></span>'
          +'<span style="margin-left:auto"></span>'
          +'<button class="btn ghost sm" onclick="downloadDiag(this)">Diagnose</button></div>'; }).join("");
    }
  });
  call("gateStatus",[],function(g){
    var el=$("engineLine"); if(!el) return;
    var eng=(g&&g.engine)||{};
    if(!g || g.error){ el.textContent=""; return; }
    if(!Object.keys(eng).length){ el.textContent="Engine not running"; el.style.color="var(--c-mut)"; return; }
    var errs=eng.errors||0;
    if(errs){ el.textContent="Detectors running · "+errs+" gate error"+(errs===1?"":"s"); el.style.color="var(--sev-high)"; }
    else { el.textContent="All detectors running · last check "+fmtDur((Date.now()/1000)-(eng.updated_at||Date.now()/1000))+" ago"; el.style.color="var(--c-live)"; }
  });
}
function startWatchPoll(){ refreshWatchState(); if(!state.watchTimer) state.watchTimer=setInterval(refreshWatchState, 4000); }
function stopWatchPoll(){ if(state.watchTimer){ clearInterval(state.watchTimer); state.watchTimer=null; } }
function stopLive(){
  stopLivePoll(); stopWatchPoll();

  (state.liveCams||[]).forEach(function(c){ var img=$("live-"+c.id); if(img) img.src=""; });
  call("liveStop",[],function(){});
}

/* Live counters from the running engine. Absent when it isn't running — an
   operator seeing "0 errors" for a dead engine would be worse than seeing nothing. */
function gateEngineRows(e){
  if(!e || !e.updated_at) return '<div class="mut" style="font-size:12px;margin-top:6px">Engine not running — no verification stats yet.</div>';
  var out0 = "";
  if(e.status){
    var sc = e.status==="critical"?"var(--sev-crit)":e.status==="degraded"?"var(--sev-high)":"var(--c-live)";
    out0 = '<div class="row" style="gap:10px;margin-top:10px;align-items:center">'
      + '<span class="dot" style="background:'+sc+'"></span>'
      + '<b style="color:'+sc+';text-transform:uppercase;font-size:12px">'+esc(e.status)+'</b>'
      + '<span class="mut" style="font-size:12px">up '+fmtAge(e.uptime_s||0)
      + (e.memory && e.memory.available_gb!=null ? ' · '+e.memory.available_gb+' GB free' : '')
      + (e.median_latency_s!=null ? ' · verify median '+e.median_latency_s+'s' : '')
      + '</span></div>'
      + ((e.reasons||[]).length
          ? '<div style="font-size:12px;margin-top:6px;color:'+sc+'">'
            + e.reasons.map(esc).join("<br>") + '</div>'
          : "");
  }
  var err = e.errors||0;
  var ec = err ? "var(--sev-high)" : "var(--c-live)";
  var out = out0 + '<div class="row" style="gap:22px;margin-top:10px;font-size:13px">'
    + '<span class="mut">verified <b>'+(e.verified||0)+'</b></span>'
    + '<span class="mut">confirmed <b>'+(e.confirmed||0)+'</b></span>'
    + '<span class="mut">rejected <b>'+(e.rejected||0)+'</b></span>'
    + '<span class="mut">queued <b>'+(e.pending||0)+'</b></span>'
    + '<span class="mut">errors <b style="color:'+ec+'">'+err+'</b></span></div>';
  if(err && e.last_error){
    out += '<div class="mut mono" style="font-size:11.5px;margin-top:7px;color:var(--sev-high);word-break:break-word">'
      + 'last: '+esc(String(e.last_error))+'</div>';
  }
  if(e.mock){
    out += '<div style="margin-top:8px;color:var(--sev-crit);font-weight:600;font-size:12.5px">'
      + '⚠ '+esc(e.banner||"UNVERIFIED — MOCK GATE")+' — alerts are not being verified.</div>';
  }
  out += componentRows(e.health||{});
  return out;
}

/* Per-component counters. A component that throws on every frame produces the
   same silence as one that correctly finds nothing — these tell them apart. */
function componentRows(h){
  var comps = h.components||[];
  if(!comps.length) return '';
  var deg = h.degraded||[];
  var rows = comps.map(function(c){
    var pct = Math.round((c.error_rate||0)*100);
    var col = c.degraded ? "var(--sev-crit)" : (c.errors ? "var(--sev-high)" : "var(--c-mut)");
    /* 480 errors at 100% with no WHAT sent the pilot a screenshot instead of
       an answer (30 Aug). The failing component's own last error rides along. */
    var why = (c.errors && c.last_error)
      ? '<tr><td colspan="4" class="mono" style="padding:0 0 6px 12px;font-size:10.5px;color:'+col+';word-break:break-all">↳ '+esc(String(c.last_error).slice(0,160))+'</td></tr>'
      : '';
    return '<tr><td class="mono" style="padding:3px 10px 3px 0">'+esc(c.name)+'</td>'
      +'<td style="text-align:right;padding-right:10px">'+(c.processed||0)+'</td>'
      +'<td style="text-align:right;padding-right:10px;color:'+col+'">'+(c.errors||0)+'</td>'
      +'<td style="text-align:right;color:'+col+'">'+pct+'%</td></tr>'+why;
  }).join("");
  var warn = deg.length
    ? '<div style="margin-top:9px;color:var(--sev-crit);font-weight:600;font-size:12.5px">'
      +'⚠ Degraded: '+deg.map(esc).join(", ")+' — failing on more than 1 in 10 attempts.</div>'
    : '';
  return '<div style="margin-top:12px"><div class="syslabel">Components</div>'
    +'<table style="font-size:12px;margin-top:6px;width:100%;max-width:420px">'
    +'<thead><tr class="mut"><th style="text-align:left">component</th>'
    +'<th style="text-align:right">ok</th><th style="text-align:right">errors</th>'
    +'<th style="text-align:right">rate</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + warn + '</div>';
}

  if(btn){ btn.disabled=true; btn.textContent="Collecting\u2026"; }
  call("downloadDiagnostics",[],function(r){
    if(btn){ btn.disabled=false; btn.textContent="\u2b07 Download diagnostics"; }
    if(!msg) return;
    if(r&&r.ok){ msg.style.color="var(--c-live)"; msg.textContent="\u2713 "+r.path+" ("+r.size_kb+" KB)"; }
    else { msg.style.color="var(--sev-crit)"; msg.textContent="\u2715 "+((r&&r.error)||"failed"); }
  });
}
function saveSiteName(){ var n=$("sysName").value.trim(); if(!n)return;
  call("setSite",[n,""],function(){ if($("sysNameOk"))$("sysNameOk").textContent="saved ✓"; refreshCounts(); }); }
function toggleNotify(ch){
  call("getSite",[],function(s){ var chans=((s&&s.notify)||"console").split(",").filter(Boolean);
    var i=chans.indexOf(ch); if(i>=0) chans.splice(i,1); else chans.push(ch);
    if(!chans.length) chans=["console"];
