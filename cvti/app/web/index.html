<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Console</title>
<script>document.documentElement.setAttribute("data-mode","dark");</script>
<style>
  /* Tokens live on :root so the app shell (#cv) AND the sibling overlays
     (#wizard, #modalRoot) all inherit them. Theme is toggled on <html>. */
  :root{--c-bg:#0a1326;--c-panel:#0f1c36;--c-raised:#13223f;--c-border:#1f2c48;--c-border2:#2a3a5c;
    --c-text:#edf1f8;--c-mut:#8d94a6;--c-sub:#5f6b84;--c-accent:#36a0da;--c-accent-soft:rgba(54,160,218,0.15);
    --c-live:#22c55e;--c-feed:#060d1c;--sev-crit:#ef4444;--sev-high:#f59e0b;--sev-med:#fad881;--sev-low:#8d94a6;
    --ff-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ff-mono:ui-monospace,Menlo,"Cascadia Code",monospace;
    --focus:0 0 0 3px rgba(54,160,218,0.35)}
  :root[data-mode="light"]{--c-bg:#f5f6f8;--c-panel:#fff;--c-raised:#fff;--c-border:#e5e7eb;--c-border2:#c7cdd8;
    --c-text:#010916;--c-mut:#616161;--c-sub:#8d94a6;--c-accent:#298ec2;--c-accent-soft:#e7f3fa;--c-live:#16a34a;
    --c-feed:#0b1220;--sev-crit:#dc2626;--sev-high:#d97706;--sev-med:#ca8a04;--sev-low:#8d94a6}
  *{box-sizing:border-box}
  /* color + font on body so ALL top-level nodes (#cv, #wizard, #modalRoot)
     inherit them — not just #cv. Otherwise overlays fall back to black serif. */
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--ff-sans);font-size:13px}
  #cv{display:flex;height:100vh;min-height:640px;background:var(--c-bg);color:var(--c-text);
    font-family:var(--ff-sans);font-size:13px;overflow:hidden}
  .mono{font-family:var(--ff-mono)}
  button{font-family:inherit}
  nav{width:206px;flex:none;background:#0e1a34;display:flex;flex-direction:column;border-right:1px solid #1f2c48}
  :root[data-mode="light"] nav{background:#0c1930}
  .brand{padding:18px}
  .brand .n{font-size:21px;font-weight:700;color:#fff;letter-spacing:.02em}
  .brand .s{font-size:11px;color:#8d94a6;margin-top:2px}
  .navitems{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
  .navbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;
    border-radius:8px;font-weight:600;font-size:13px;color:#c7cdd8}
  .navbtn:hover{background:rgba(255,255,255,.06)}
  .navbtn.on{background:var(--c-accent-soft);color:#fff}
  .navbtn .badge{margin-left:auto;background:var(--sev-crit);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;text-align:center;padding:2px 5px;border-radius:99px;font-family:var(--ff-mono)}
  .navfoot{margin-top:auto;padding:14px 18px;border-top:1px solid #1f2c48;color:#5f6b84;font-size:11px}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.bar{flex:none;display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--c-border);
    background:var(--c-panel)}
  header.bar h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:12px;color:var(--c-mut)}
  .stats b{font-family:var(--ff-mono);color:var(--c-text);font-weight:500}
  .themebtn{all:unset;cursor:pointer;border:1px solid var(--c-border);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--c-mut)}
  #screen{flex:1;min-height:0;overflow:auto}
  .pad{padding:18px 24px 28px}
  h2{font-size:20px;font-weight:600;margin:0 0 4px}
  .mut{color:var(--c-mut)} .sub{color:var(--c-sub)}
  .panel{background:var(--c-panel);border:1px solid var(--c-border);border-radius:10px}
  .btn{all:unset;cursor:pointer;background:var(--c-accent);color:#fff;font-weight:700;padding:10px 18px;border-radius:8px;font-size:13px}
  .btn:focus-visible{box-shadow:var(--focus)}
  .btn.ghost{background:transparent;border:1px solid var(--c-border2);color:var(--c-text);font-weight:600}
  .btn.sm{padding:8px 14px;font-size:12.5px}
  input,select{background:var(--c-bg);border:1px solid var(--c-border2);color:var(--c-text);border-radius:8px;
    padding:9px 11px;font-family:var(--ff-sans);font-size:13px;outline:none}
  input:focus,select:focus{box-shadow:var(--focus);border-color:var(--c-accent)}
  input.mono{font-family:var(--ff-mono)}
  label.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{cursor:pointer;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--c-border2);
    color:var(--c-mut);background:transparent;user-select:none}
  .chip.on{border-color:var(--c-accent);color:#fff;background:var(--c-accent-soft)}
  /* cameras table */
  .thead,.trow{display:grid;grid-template-columns:150px 1fr 130px 200px 90px;gap:12px;padding:11px 16px;align-items:center}
  .thead{border-bottom:1px solid var(--c-border);font-size:10.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--c-sub)}
  .trow{border-bottom:1px solid var(--c-border)}
  .trow:last-child{border-bottom:none}
  .dot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:6px}
  /* alerts */
  .alertswrap{display:flex;flex-direction:column;height:100%;min-height:0}
  .alerts{display:flex;flex:1;min-height:0}
  /* Ask your cameras */
  .askpad{max-width:960px}
  .askbar{display:flex;gap:10px;margin-top:6px}
  .askbar input{flex:1;font-size:15px;padding:12px 14px;border-radius:9px;border:1px solid var(--c-border2);
    background:var(--c-raised);color:var(--c-text)}
  .askbar input:focus{outline:none;border-color:var(--c-accent)}
  .askchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .askchip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--c-border2);
    background:transparent;color:var(--c-sub);cursor:pointer}
  .askchip:hover{border-color:var(--c-accent);color:var(--c-accent)}
  .askanswer{font-size:14.5px;margin:20px 0 6px;line-height:1.5}
  .askgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
  .askcard{border:1px solid var(--c-border);border-radius:10px;overflow:hidden;background:var(--c-raised)}
  .askcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .asknoimg{aspect-ratio:16/9;display:grid;place-items:center;color:var(--c-sub);background:var(--c-feed);font-size:12px}
  .askmeta{padding:11px 13px}
  /* Learning screen */
  .lhero{display:flex;align-items:center;gap:26px;padding:16px 20px;border:1px solid var(--c-border);border-radius:12px;
    background:linear-gradient(90deg,var(--c-raised),transparent);margin-bottom:14px}
  .lh-item{display:flex;flex-direction:column;gap:1px}
  .lh-n{font-family:var(--ff-mono);font-size:24px;font-weight:600;line-height:1;color:var(--c-text)}
  .lh-l{font-size:11px;color:var(--c-mut)}
  .lh-say{margin-left:auto;max-width:300px;text-align:right;font-size:12px;color:var(--c-sub);line-height:1.4}
  .lh-say b{color:var(--sev-crit)}
  .ldemote{font-size:12.5px;color:var(--c-sub);background:var(--c-raised);border:1px solid var(--c-border);
    border-radius:8px;padding:9px 13px;margin-bottom:12px}
  .lpanel{border:1px solid var(--c-border);border-radius:10px;overflow:hidden}
  .ltable{width:100%;border-collapse:collapse;font-size:13px}
  .ltable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-mut);
    padding:9px 12px;border-bottom:1px solid var(--c-border);background:var(--c-raised)}
  .ltable td{padding:9px 12px;border-bottom:1px solid var(--c-border)}
  .ltable tr:last-child td{border-bottom:none}
  .lbadge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid}
  /* Site map / floor plan */
  .floorplan{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;border:1px solid var(--c-border2);
    border-radius:14px;background:var(--c-raised);overflow:hidden}
  .fp-grid{position:absolute;inset:0;background-image:linear-gradient(var(--c-border) 1px,transparent 1px),linear-gradient(90deg,var(--c-border) 1px,transparent 1px);
    background-size:40px 40px;opacity:.4}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:1}
  .pindot{width:16px;height:16px;border-radius:99px;background:var(--c-live);box-shadow:0 0 0 4px rgba(34,197,94,.18);flex:none}
  .pindot.alert,.pin.alerting .pindot{background:var(--sev-crit);box-shadow:0 0 0 4px rgba(239,68,68,.25)}
  .pin.alerting{z-index:3}
  .pin.alerting .pindot{animation:pinpulse 1s infinite}
  @keyframes pinpulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.5),0 0 12px rgba(239,68,68,.6)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0),0 0 12px rgba(239,68,68,.9)}}
  .pinlabel{font-size:11px;font-weight:600;color:var(--c-text);background:var(--c-bg);padding:2px 8px;border-radius:99px;border:1px solid var(--c-border);white-space:nowrap}
  .pinalert{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--sev-crit);padding:3px 8px;border-radius:5px;
    text-transform:uppercase;display:none}
  .pin.alerting .pinalert{display:block}
  /* offline / local-only proof badge */
  .netbadge{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:6px;
    display:inline-block;border:1px solid var(--c-border2);color:var(--c-live)}
  .netbadge.offline{background:rgba(34,197,94,.14);border-color:var(--c-live);color:var(--c-live);animation:netflash .5s ease-out}
  @keyframes netflash{0%{transform:scale(1.08)}100%{transform:scale(1)}}
  /* detection -> verification timeline */
  .timeline{display:flex;align-items:center;gap:0;margin-top:16px;padding:12px 4px}
  .tl-step{display:flex;align-items:center;gap:9px}
  .tl-dot{width:11px;height:11px;border-radius:99px;background:var(--c-border2);flex:none;box-shadow:0 0 0 3px var(--c-raised)}
  .tl-dot.on{background:var(--c-live)}
  .tl-t{font-size:12.5px;font-weight:700;color:var(--c-text);white-space:nowrap}
  .tl-s{font-size:10.5px;color:var(--c-mut);white-space:nowrap}
  .tl-line{flex:1;height:2px;background:var(--c-border);position:relative;margin:0 10px;min-width:26px}
  .tl-lat{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--ff-mono);
    font-size:10px;color:var(--c-accent);background:var(--c-bg);padding:0 5px;white-space:nowrap}
  /* incident report modal */
  .report{background:#fff;color:#111;max-width:720px;width:92%;max-height:88vh;overflow:auto;border-radius:12px;
    margin:4vh auto;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .report .rhead{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:2px solid #111}
  .report .rbrand{font-size:20px;font-weight:800;letter-spacing:.02em}
  .report .rsev{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;padding:4px 12px;border-radius:5px}
  .report .rbody{padding:22px 26px}
  .report h3{margin:0 0 4px;font-size:19px}
  .report .rgrid{display:grid;grid-template-columns:120px 1fr;gap:6px 16px;margin:16px 0;font-size:13px}
  .report .rgrid .k{color:#666;font-weight:600}
  .report .rgrid .v{font-family:var(--ff-mono);color:#111}
  .report .rreason{background:#f4f5f7;border-left:3px solid #111;padding:12px 14px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
  .report .rframes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .report .rframes img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid #ddd}
  .report .rfoot{padding:14px 26px;border-top:1px solid #e3e3e3;display:flex;gap:10px;align-items:center;font-size:11px;color:#888}
  .reportmodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);overflow:auto}
  @media print{
    body.printing-report #cv,body.printing-report #wizard{display:none!important}
    body.printing-report .reportmodal{position:static;background:#fff;overflow:visible}
    body.printing-report .noprint{display:none!important}
    body.printing-report .report{box-shadow:none;margin:0;max-width:none;max-height:none}
  }
  .alist{width:390px;flex:none;border-right:1px solid var(--c-border);display:flex;flex-direction:column;min-height:0}
  .alist .scroll{flex:1;overflow:auto}
  .arow{display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--c-border)}
  .arow:hover{background:var(--c-raised)} .arow.sel{background:var(--c-raised);box-shadow:inset 3px 0 0 var(--c-accent)}
  .afilter{display:flex;flex-wrap:wrap;gap:3px;padding:9px 10px;border-bottom:1px solid var(--c-border);flex:none}
  .atab{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--c-mut);padding:5px 8px;border-radius:7px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .atab:hover{background:var(--c-raised)} .atab.on{background:var(--c-accent-soft);color:var(--c-text)}
  .acnt{font-family:var(--ff-mono);font-size:10.5px;background:var(--c-border);color:var(--c-mut);padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
  .atab.on .acnt{background:var(--c-accent);color:#fff}
  .adetail{flex:1;min-width:0;overflow:auto;padding:20px 26px}
  .sevbadge{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:5px;color:#fff}
  .frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .frames img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--c-border);background:var(--c-feed)}
  /* event clip player (auto-looping evidence frames) */
  .clipwrap{position:relative;margin-top:14px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--c-border);box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .clipwrap img,.clipwrap video{width:100%;height:100%;object-fit:contain;background:#000;display:block;transition:opacity .22s ease}
  .clipbadge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:6px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .clipbadge .dot{width:6px;height:6px;border-radius:99px;background:var(--sev-crit);animation:clippulse 1.4s ease-in-out infinite}
  @keyframes clippulse{0%,100%{opacity:1}50%{opacity:.35}}
  .clipcounter{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--ff-mono);
    font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
  .clipprog{position:absolute;left:0;bottom:0;height:3px;background:var(--c-accent);width:0;transition:width .22s linear}
  .clipstrip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
  .clipstrip img{height:50px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid var(--c-border);cursor:pointer;flex:none;opacity:.62;transition:opacity .15s ease,border-color .15s ease,transform .15s ease}
  .clipstrip img:hover{border-color:var(--c-accent);opacity:1}
  .clipstrip img.on{border-color:var(--c-accent);opacity:1;transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .snapwrap{position:relative;aspect-ratio:16/9;background:var(--c-feed);border-radius:10px;overflow:hidden;
    border:1px solid var(--c-border);display:flex;align-items:center;justify-content:center;color:var(--c-mut)}
  .snapwrap img{width:100%;height:100%;object-fit:cover}
  .spin{width:26px;height:26px;border-radius:99px;border:3px solid var(--c-border2);border-top-color:var(--c-accent);
    animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{max-width:460px;margin:70px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .kbd{font-family:var(--ff-mono);font-size:11px;color:var(--c-sub)}
  .confbar{flex:1;height:6px;background:var(--c-border);border-radius:99px;max-width:280px}
  .confbar>div{height:100%;border-radius:99px}
  /* first-run wizard */
  #wizard{position:fixed;inset:0;z-index:50;background:var(--c-bg);display:none;flex-direction:column}
  #wizard.on{display:flex}
  .wizhead{flex:none;padding:20px 40px 0}
  .wizbrand{font-size:22px;font-weight:700;color:var(--c-text);letter-spacing:.02em}
  .steps{display:flex;gap:8px;margin-top:16px;align-items:center}
  .steps .st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--c-sub)}
  .steps .st .num{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;
    border:1px solid var(--c-border2);color:var(--c-sub)}
  .steps .st.on{color:var(--c-text)} .steps .st.on .num{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
  .steps .st.done .num{background:var(--c-live);border-color:var(--c-live);color:#fff}
  .steps .sep{flex:1;height:1px;background:var(--c-border);max-width:40px}
  .wizbody{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:28px 40px}
  .wizcard{width:100%;max-width:680px}
  .wizcard h2{font-size:26px;margin:0 0 6px} .wizcard .lead{color:var(--c-mut);font-size:14px;line-height:1.55;margin:0 0 20px}
  .wizfoot{flex:none;display:flex;gap:12px;align-items:center;padding:16px 40px;border-top:1px solid var(--c-border)}
  .wizfoot .spacer{flex:1}
  .found{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .found .ip{cursor:pointer;font-family:var(--ff-mono);font-size:12px;padding:6px 10px;border-radius:6px;
    border:1px solid var(--c-border2);color:var(--c-text)}
  .found .ip:hover{border-color:var(--c-accent);color:var(--c-accent)}
  .addedlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .addedcam{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--c-border);border-radius:8px}
  .statusbig{display:flex;align-items:center;gap:14px;padding:18px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-panel)}
  .statusdot{width:12px;height:12px;border-radius:99px;flex:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* live wall */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .tile{position:relative;aspect-ratio:16/9;background:var(--c-feed);border:1px solid var(--c-border);
    border-radius:10px;overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--c-sub)}
  .tlabel{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:7px;font-size:12.5px;
    font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);font-family:var(--ff-mono)}
  .livedot{width:8px;height:8px;border-radius:99px;background:var(--c-live);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  /* a camera that's actively alerting */
  .tile.alerting{border-color:var(--alertcol,var(--sev-crit))!important;animation:alertpulse 1.1s infinite;z-index:1}
  @keyframes alertpulse{0%,100%{box-shadow:0 0 0 2px var(--alertcol,var(--sev-crit)),0 0 14px rgba(239,68,68,.35)}50%{box-shadow:0 0 0 2px var(--alertcol,var(--sev-crit)),0 0 26px rgba(239,68,68,.65)}}
  .tile.justfired{animation:alertpulse 1.1s infinite, tileflash .5s ease-out}
  @keyframes tileflash{0%{transform:scale(1.04);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}
  .talert{position:absolute;top:0;left:0;right:0;padding:9px 11px 16px;display:none;
    background:linear-gradient(180deg,rgba(220,38,38,.94),rgba(220,38,38,0))}
  .tile.alerting .talert{display:block}
  .talert .r{font-weight:800;font-size:12px;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .talert .why{font-size:11px;color:#fff;opacity:.95;margin-top:3px;line-height:1.3;max-height:2.7em;overflow:hidden}
  .tile.alerting .livedot{background:var(--sev-crit)}
  /* live tile zoom affordance + expand modal */
  .tzoom{position:absolute;top:8px;right:9px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.5);
    color:#fff;text-align:center;line-height:24px;font-size:13px;opacity:0;transition:opacity .12s;pointer-events:none}
  .tile:hover .tzoom{opacity:1}
  .livemodal{position:fixed;inset:0;background:rgba(4,8,18,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:36px}
  .livemodal-inner{position:relative;width:100%;max-width:1120px;aspect-ratio:16/9;background:#000;border-radius:12px;
    overflow:hidden;border:1px solid var(--c-border2);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .livemodal-inner img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .lmclose{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:99px;
    background:rgba(0,0,0,.6);color:#fff;text-align:center;line-height:34px;font-size:15px}
  .lmclose:hover{background:rgba(0,0,0,.85)}
  .lmlabel{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;color:#fff;
    font-family:var(--ff-mono);font-weight:600;font-size:14px;text-shadow:0 1px 4px #000}
  .lmalert{background:var(--sev-crit);color:#fff;padding:4px 10px;border-radius:6px;font-family:var(--ff-sans);font-size:12px;font-weight:700}
  /* rules page */
  .rulecard{padding:15px 17px;margin-bottom:12px}
  .detrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .detchip{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    padding:8px 13px;border-radius:8px;border:1px solid var(--c-border2);color:var(--c-mut);user-select:none}
  .detchip:hover{border-color:var(--c-accent)}
  .detchip.on{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-text)}
  .detchip .dt{font-size:11px;color:var(--c-sub)} .detchip.on .dt{color:var(--c-accent)}
  /* scene context + custom threats */
  .scenehint{font-size:12px;color:var(--c-mut);margin-top:10px;padding:9px 11px;background:var(--c-bg);
    border-radius:8px;border:1px solid var(--c-border);line-height:1.45}
  .envtag{display:inline-block;font-family:var(--ff-mono);font-size:10px;font-weight:700;color:var(--c-accent);
    background:var(--c-accent-soft);padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;margin-right:8px}
  .customthreat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;
    border:1px solid var(--c-border);border-radius:8px;margin-top:6px;font-size:12.5px}
  .customthreat b{font-weight:700}
  /* zone drawing modal */
  .zonemodal{position:fixed;inset:0;background:rgba(4,8,18,.9);z-index:70;display:flex;align-items:center;justify-content:center;padding:30px}
  .zonemodal-inner{background:var(--c-panel);border:1px solid var(--c-border2);border-radius:12px;padding:18px 20px;max-width:800px;width:100%}
  .zmhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}
  .zmcanvaswrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--c-border);margin:0 auto;background:#000}
  .zmcanvaswrap img{display:block}
  .zmcanvaswrap canvas{position:absolute;top:0;left:0;cursor:crosshair}
  /* system page */
  .syslabel{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c-sub)}
  .sysnotifies{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .sysnotify{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:8px;cursor:pointer}
  .sysnotify:hover{background:var(--c-raised)}
  .sysnotify input{width:16px;height:16px;flex:none}
</style>
</head>
<body>
<div id="cv" data-mode="dark">
  <nav>
    <div class="brand"><div class="n">Argus</div><div class="s" id="siteName">Site 01 · local</div></div>
    <div class="navitems" id="nav"></div>
    <div class="navfoot">
      <div class="row" style="gap:8px"><span class="dot" id="monDot" style="background:var(--c-sub)"></span>
        <span id="monLabel" style="font-weight:600;color:#c7cdd8">Idle</span></div>
      <div class="mono" id="monGate" style="margin-top:6px">TrueSight · on-device</div>
      <div class="netbadge" id="netBadge" title="Argus runs entirely on this machine — it needs no internet, and nothing leaves your network">🔒 Local-only</div>
      <div style="margin-top:4px;color:#3d4a66">Argus Edge v0.9</div>
    </div>
  </nav>
  <main>
    <header class="bar">
      <h1 id="title">Cameras</h1>
      <div class="stats">
        <span><b id="stCams">0</b> cameras</span>
        <span><b id="stPending">0</b> to review</span>
        <button class="btn sm" id="monBtn" onclick="toggleMonitor()">▶ Start monitoring</button>
        <button class="themebtn" onclick="toggleTheme()">◐ theme</button>
      </div>
    </header>
    <div id="screen"><div class="pad mut">Loading…</div></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="wizard"></div>

<script>
"use strict";
var backend = null, state = {route:"cameras", cameras:[], events:[], selected:null, presets:{}, test:null, scanHosts:[]};
var NAV = [["cameras","Cameras"],["alerts","Alerts"],["live","Live"],["map","Map"],["ask","Ask"],["learning","Learning"],["rules","Rules"],["system","System"]];
var SEV = {critical:"var(--sev-crit)",high:"var(--sev-high)",medium:"var(--sev-med)",low:"var(--sev-low)"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(id){return document.getElementById(id);}
function call(method, args, cb){ // args: array; cb(obj)
  if(!backend){cb&&cb({error:"backend not connected"});return;}
  var f = backend[method];
  var done = function(json){ try{cb&&cb(JSON.parse(json));}catch(e){cb&&cb({error:"bad response"});} };
  f.apply(backend, (args||[]).concat([done]));
}

function renderNav(){
  $("nav").innerHTML = NAV.map(function(n){
    var on = state.route===n[0] ? " on" : "";
    var badge = (n[0]==="alerts" && state.pending>0) ? '<span class="badge">'+state.pending+'</span>' : '';
    return '<button class="navbtn'+on+'" onclick="go(\''+n[0]+'\')">'+n[1]+badge+'</button>';
  }).join("");
}
function go(r){
  if(state.route==="live" && r!=="live") stopLive();
  if(state.route==="alerts" && r!=="alerts") stopAlertsPoll();
  state.route=r; state.selected=null; renderNav(); render();
}

/* ---------- monitoring engine control ---------- */
function refreshMonitor(){ call("monitoringStatus",[],function(s){ applyMonitor(s && s.running); }); }
function applyMonitor(running){
  state.monitoring = !!running;
  var b=$("monBtn"); if(b){ b.textContent = running ? "■ Stop monitoring" : "▶ Start monitoring";
    b.className = running ? "btn sm" : "btn ghost sm"; }
  var dot=$("monDot"), lab=$("monLabel");
  if(dot) dot.style.background = running ? "var(--c-live)" : "var(--c-sub)";
  if(lab) lab.textContent = running ? "Monitoring" : "Idle";
}
function toggleMonitor(){
  var b=$("monBtn"); if(b){ b.textContent="…"; }
  if(state.monitoring){ call("stopMonitoring",[],function(){ refreshMonitor(); }); }
  else { call("startMonitoring",[],function(r){ applyMonitor(true);
    // engine takes ~15-30s to load models; alerts start flowing after that
    if($("monGate")) $("monGate").textContent="TrueSight · loading models…";
    setTimeout(function(){ if($("monGate")) $("monGate").textContent="TrueSight · live"; }, 25000);
  }); }
}

function refreshCounts(){
  call("counts",[],function(c){ if(c&&!c.error){ state.pending=c.pending_alerts||0;
    $("stCams").textContent=c.cameras||0; $("stPending").textContent=c.pending_alerts||0; renderNav(); } });
}

function render(){
  var t = {cameras:"Cameras",alerts:"Alerts",live:"Live wall",map:"Site map",ask:"Ask your cameras",learning:"Learning",rules:"Rules",system:"System"}[state.route];
  $("title").textContent = t;
  if(state.route==="cameras") return renderCameras();
  if(state.route==="alerts") return renderAlerts();
  if(state.route==="live") return renderLive();
  if(state.route==="map") return renderMap();
  if(state.route==="ask") return renderAsk();
  if(state.route==="learning") return renderLearning();
  if(state.route==="rules") return renderRules();
  if(state.route==="system") return renderSystem();
  $("screen").innerHTML='<div class="pad"><h2>'+t+'</h2><p class="mut">Coming soon.</p></div>';
}

/* ---------- Ask your cameras (NL search over past events) ---------- */
var ASK_EXAMPLES = ["anyone near the till", "theft in the last hour", "fire or smoke",
                    "someone on the ground", "weapons", "crowd forming"];
function renderAsk(){
  var chips = ASK_EXAMPLES.map(function(q){ return '<button class="askchip" onclick="askRun(\''+esc(q)+'\')">'+esc(q)+'</button>'; }).join("");
  $("screen").innerHTML='<div class="pad askpad">'
    +'<div class="askhead"><h2 style="margin:0 0 4px">Ask your cameras</h2>'
    +'<p class="mut" style="margin:0 0 14px">Search everything Argus has seen, in plain English. TrueSight reads the footage log and finds what you mean — not just keywords.</p>'
    +'<div class="askbar"><input id="askInput" placeholder="e.g. anyone loitering near the entrance after dark" '
    +'onkeydown="if(event.key===\'Enter\')askRun()"><button class="btn" onclick="askRun()">Search</button></div>'
    +'<div class="askchips">'+chips+'</div></div>'
    +'<div id="askResults" class="askresults"><div class="mut" style="margin-top:24px">Ask a question to search your event history.</div></div></div>';
}
function askRun(q){
  var inp=$("askInput"); if(q&&inp) inp.value=q; var query=(inp&&inp.value||q||"").trim();
  if(!query) return;
  var res=$("askResults"); if(res) res.innerHTML='<div class="row" style="margin-top:24px;gap:10px"><span class="spin"></span><span class="mut">TrueSight is searching your footage…</span></div>';
  call("searchEvents",[query],function(r){
    if(!res) return;
    if(!r || r.error){ res.innerHTML='<div class="mut" style="margin-top:24px">Search failed: '+esc((r&&r.error)||"unknown")+'</div>'; return; }
    var m=r.matches||[];
    var head='<div class="askanswer">'+(r.answer?('<b>'+esc(r.answer)+'</b>'):('Found '+m.length+' event'+(m.length===1?'':'s')+'.'))
      +' <span class="mut" style="font-size:11.5px">· '+m.length+' match'+(m.length===1?'':'es')+' · via '+esc(r.engine||"search")+'</span></div>';
    if(!m.length){ res.innerHTML=head+'<div class="mut" style="margin-top:14px">Nothing matched. Try different wording, or check the Alerts tab.</div>'; return; }
    var cards=m.map(function(e){
      var fr=(e.frames&&e.frames[0])||"";
      var sev=SEV[e.priority]||SEV.low;
      return '<div class="askcard">'+(fr?'<img src="'+fr+'">':'<div class="asknoimg">no frame</div>')
        +'<div class="askmeta"><div class="row" style="gap:8px"><span class="sevbadge" style="background:'+sev+';font-size:9px;padding:2px 7px">'+esc((e.priority||"").toUpperCase())+'</span>'
        +'<b>'+esc(e.rule)+'</b><span style="flex:1"></span><span class="mono mut" style="font-size:11px">'+esc(e.camera_id)+'</span></div>'
        +'<div class="mut" style="font-size:12px;margin-top:5px;line-height:1.4">'+esc(e.reason||"")+'</div>'
        +'<div class="mono sub" style="font-size:11px;margin-top:6px">'+esc((e.iso||"").replace("T"," "))+'</div></div></div>';
    }).join("");
    res.innerHTML=head+'<div class="askgrid">'+cards+'</div>';
  });
}
/* ---------- Learning (feedback / reinforcement loop) ---------- */
function renderLearning(){
  $("screen").innerHTML='<div class="pad mut">Loading learning status…</div>';
  call("learningStats",[],function(s){ if(!s||s.error){ $("screen").innerHTML='<div class="pad"><h2>Learning</h2><p class="mut">'+esc((s&&s.error)||"unavailable")+'</p></div>'; return; } drawLearning(s); });
}
function pct(x){ return x==null? "—" : Math.round(x*100)+"%"; }
function drawLearning(s){
  var L=s.labels||{}, prec=s.overall_precision, dem=s.demoted||[], rules=s.rules||[], model=s.model||{};
  var head='<div class="lhero">'
    +'<div class="lh-item"><div class="lh-n">'+(L.reviewed||0)+'</div><div class="lh-l">labels from operators</div></div>'
    +'<div class="lh-item"><div class="lh-n" style="color:var(--c-live)">'+(L.positive||0)+'</div><div class="lh-l">confirmed real</div></div>'
    +'<div class="lh-item"><div class="lh-n" style="color:var(--sev-crit)">'+(L.negative||0)+'</div><div class="lh-l">marked false alarm</div></div>'
    +'<div class="lh-item"><div class="lh-n">'+pct(prec)+'</div><div class="lh-l">gate precision</div></div>'
    +'<div class="lh-say">Operator labels teach the system: noisy rules get <b>demoted</b> (stop paging), and every label becomes training data.</div></div>';
  var rowsHtml = rules.length ? rules.map(function(r){
    var col=r.action==="demote"?"var(--sev-crit)":r.action==="trusted"?"var(--c-live)":"var(--c-mut)";
    return '<tr><td><b>'+esc(r.camera_id)+'</b></td><td class="mono">'+esc(r.rule)+'</td>'
      +'<td style="text-align:center;color:var(--c-live)">'+r.positive+'</td>'
      +'<td style="text-align:center;color:var(--sev-crit)">'+r.negative+'</td>'
      +'<td style="text-align:center" class="mono">'+pct(r.precision)+'</td>'
      +'<td style="text-align:center"><span class="lbadge" style="color:'+col+';border-color:'+col+'">'+esc(r.action)+'</span></td></tr>';
  }).join("") : '<tr><td colspan="6" class="mut" style="padding:16px">No labels yet — review a few alerts (True threat / False alarm) and they\'ll appear here.</td></tr>';
  var mv=model.active;
  var modelHtml = mv ? ('active model v'+mv.version+' · '+ (mv.metrics&&mv.metrics.clips?mv.metrics.clips+' clips':'') ) : 'baseline model (no retrain yet)';
  $("screen").innerHTML='<div class="pad" style="max-width:900px">'
    +'<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Learning</h2><span style="flex:1"></span>'
    +'<button class="btn sm" onclick="runCalibrate(this)">↻ Re-run calibration</button></div>'
    +head
    +(dem.length?'<div class="ldemote">🔕 Demoted (stored but not paging): <b>'+dem.map(esc).join(", ")+'</b></div>':'')
    +'<div class="lpanel"><table class="ltable"><thead><tr><th>Camera</th><th>Rule</th><th>Real</th><th>False</th><th>Precision</th><th>Action</th></tr></thead>'
    +'<tbody>'+rowsHtml+'</tbody></table></div>'
    +'<div class="row" style="margin-top:14px;gap:16px;font-size:12.5px"><span class="mut">Detector model: <b style="color:var(--c-text)">'+esc(modelHtml)+'</b></span>'
    +'<span class="mut">retrain via <b class="mono">python -m cvti.feedback.manager retrain --run</b></span></div></div>';
}
function runCalibrate(btn){ if(btn){ btn.disabled=true; btn.textContent="Calibrating…"; }
  call("learningCalibrate",[],function(r){ renderLearning(); }); }
/* ---------- Site map (cameras light up on alert) ---------- */
function renderMap(){
  $("screen").innerHTML='<div class="pad mut">Loading site map…</div>';
  call("listCameras",[],function(cs){ state.mapCams=(Array.isArray(cs)?cs:[]); drawMap(); });
}
function drawMap(){
  var cams=state.mapCams||[];
  if(!cams.length){ $("screen").innerHTML='<div class="pad"><h2>Site map</h2><p class="mut">No cameras configured yet — add cameras and they\'ll appear here. Pins light up the moment TrueSight confirms a threat.</p></div>'; return; }
  var n=cams.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols);
  var pins=cams.map(function(c,i){
    // stored position (map_x/map_y as 0..1) if present, else auto-grid
    var col=i%cols, row=Math.floor(i/cols);
    var x=(c.map_x!=null? c.map_x*100 : ((col+0.5)/cols)*100);
    var y=(c.map_y!=null? c.map_y*100 : ((row+0.5)/rows)*100);
    return '<div class="pin" id="pin-'+esc(c.id)+'" style="left:'+x+'%;top:'+y+'%" onclick="go(\'live\')" title="'+esc(c.id)+' — click for live view">'
      +'<div class="pinalert" id="pinalert-'+esc(c.id)+'"></div>'
      +'<span class="pindot"></span><span class="pinlabel">'+esc(c.id)+'</span></div>';
  }).join("");
  $("screen").innerHTML='<div class="pad"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">Site map</h2>'
    +'<span class="mut" style="font-size:12px">camera layout · a pin flashes red when TrueSight confirms a threat there</span></div>'
    +'<div class="floorplan"><div class="fp-grid"></div>'+pins+'</div>'
    +'<div class="row" style="margin-top:10px;gap:16px;font-size:12px" class="mut">'
    +'<span class="mut"><span class="pindot" style="position:static;display:inline-block;vertical-align:middle"></span> live</span>'
    +'<span class="mut"><span class="pindot alert" style="position:static;display:inline-block;vertical-align:middle"></span> threat confirmed</span></div></div>';
  updateMapPins();
}
function updateMapPins(){
  var active={};
  (state.latestEvents||[]).forEach(function(e){ if(e.review==="new" && !active[e.camera_id]) active[e.camera_id]=e; });
  (state.mapCams||[]).forEach(function(c){
    var pin=$("pin-"+c.id), ov=$("pinalert-"+c.id), a=active[c.id]; if(!pin) return;
    if(a){ pin.classList.add("alerting"); if(ov) ov.textContent="⚠ "+a.rule; }
    else { pin.classList.remove("alerting"); if(ov) ov.textContent=""; }
  });
}
/* ---------- Cameras ---------- */
function renderCameras(){
  call("presets",[],function(p){ state.presets = (p&&!p.error)?p:{}; });
  call("listCameras",[],function(cams){
    state.cameras = Array.isArray(cams)?cams:[];
    var presetOpts = Object.keys(state.presets).map(function(k){return '<option value="'+esc(state.presets[k])+'">'+esc(k)+'</option>';}).join("");
    var rows = state.cameras.map(function(c){
      var sig=[c.concealment&&"conceal",c.video_action&&"video",c.violence&&"violence"].filter(Boolean).join(" · ")||"basic";
      return '<div class="trow"><span class="mono" style="font-weight:600">'+esc(c.id)+'</span>'
        +'<span class="mono mut" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((c.source||"").split("@").pop())+'</span>'
        +'<span><span class="dot" style="background:var(--c-live)"></span>configured</span>'
        +'<span class="mut">'+esc((c.config||"").split("/").pop())+'</span>'
        +'<span class="mono sub">'+esc(sig)+'</span></div>';
    }).join("");
    var table = state.cameras.length ?
      ('<div class="panel" style="overflow:hidden;margin-top:8px"><div class="thead"><span>Camera</span><span>Source</span><span>Status</span><span>Rule preset</span><span>Signals</span></div>'+rows+'</div>')
      : '<div class="empty"><div style="font-size:22px;font-weight:600">Connect your first camera</div><p class="mut" style="line-height:1.5">Argus works with the cameras you already have. Paste a stream address or scan your network. Nothing leaves this PC.</p></div>';
    var testHtml = renderTestBox();
    $("screen").innerHTML =
      '<div class="pad">'
      + '<div class="panel" style="padding:16px 18px;margin-bottom:14px">'
      +   '<div class="row"><input id="cidr" placeholder="192.168.1.0/24" style="flex:1"><button class="btn ghost sm" onclick="doScan()">Scan network</button></div>'
      +   '<div id="scanRes" class="mut" style="margin-top:8px;font-size:12px"></div>'
      +   '<div style="height:1px;background:var(--c-border);margin:14px 0"></div>'
      +   '<div class="row"><input id="url" class="mono" placeholder="rtsp://user:pass@192.168.1.10:554/Streaming/Channels/102" style="flex:1;min-width:320px"></div>'
      +   '<div class="row" style="margin-top:10px"><input id="cname" placeholder="name e.g. entrance" style="width:200px">'
      +     '<select id="preset">'+presetOpts+'</select>'
      +     '<label class="row" style="gap:6px;font-weight:600"><input type="checkbox" id="cConceal" checked> concealment</label>'
      +     '<label class="row" style="gap:6px;font-weight:600"><input type="checkbox" id="cVideo" checked> video</label>'
      +     '<button class="btn ghost sm" onclick="doTest()">Test</button><button class="btn sm" onclick="doAdd()">Add camera</button></div>'
      +   '<div id="testBox" style="margin-top:12px;max-width:420px">'+testHtml+'</div>'
      + '</div>'
      + table + '</div>';
    // auto-fill the detected subnet so the operator never types one
    call("detectSubnet",[],function(r){ if(r&&r.cidr && $("cidr") && !$("cidr").value) $("cidr").value=r.cidr; });
  });
}
function renderTestBox(){
  var t = state.test;
  if(!t) return '';
  if(t.busy) return '<div class="snapwrap"><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><span class="spin"></span><span>Connecting…</span></div></div>';
  if(t.error) return '<div class="snapwrap" style="color:var(--sev-crit);text-align:center;padding:16px">'+esc(t.error)+'</div>';
  if(t.ok) return '<div class="snapwrap"><img src="'+t.snapshot+'"></div><div style="color:var(--c-live);font-weight:600;margin-top:6px;font-size:12.5px">✓ Connected — '+t.w+'×'+t.h+' @ '+t.fps+' fps</div>';
  return '';
}
function doScan(){ var c=$("cidr").value.trim(); if(!c){$("scanRes").textContent="Enter a subnet like 192.168.1.0/24";return;}
  $("scanRes").textContent="Scanning…";
  call("scan",[c],function(r){ if(r.error){$("scanRes").textContent=r.error;return;}

var LIVE_ALERT_WINDOW = 8;   // seconds a tile shows its label after an event, then it clears
function updateLiveAlertTiles(){
  var nowS = Date.now()/1000;
  var active = {};   // camera -> its most RECENT event
  (state.latestEvents||[]).forEach(function(e){
    if(!active[e.camera_id] || (e.ts||0) > (active[e.camera_id].ts||0)) active[e.camera_id]=e; });
  var wall = document.querySelector(".wall");
  var prev = state._alertingCams || {};
  var now = {};
  (state.liveCams||[]).forEach(function(c){
    var tile=$("tile-"+c.id), ov=$("talert-"+c.id), a=active[c.id];
    if(!tile) return;
    // Only show the label while the event is HAPPENING (fresh); once recorded it
    // leaves, and only returns when another event fires on this camera.
    var fresh = a && (nowS - (a.ts||0) < LIVE_ALERT_WINDOW);
    if(fresh){
      now[c.id]=true;
      tile.classList.add("alerting");
      // colour the ring by severity (critical stays red; high = amber)
      tile.style.setProperty("--alertcol", SEV[a.priority]||SEV.critical);
      if(ov) ov.innerHTML='<div class="r">⚠ '+esc(a.rule)+'</div><div class="why">'+esc(a.reason||"")+'</div>';
      if(!prev[c.id] && wall){                 // NEW fire this cycle
        wall.insertBefore(tile, wall.firstChild);   // jump to the front of the wall
        tile.classList.remove("justfired"); void tile.offsetWidth;   // restart the flash
        tile.classList.add("justfired");
      }
    } else {
      tile.classList.remove("alerting","justfired"); tile.style.removeProperty("--alertcol");
      if(ov) ov.innerHTML="";
    }
  });

}

function zoneRedraw(){
  var cv=$("zmcanvas"); if(!cv) return; var ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);

    ctx.fillRect(x,y,w,hh); ctx.strokeRect(x,y,w,hh);
    [[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]].forEach(function(c){ ctx.beginPath(); ctx.arc(c[0],c[1],4,0,6.28);
      ctx.fillStyle="#36a0da"; ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke(); });
    if(h) h.textContent = (w>4&&hh>4) ? Math.round(w)+"×"+Math.round(hh)+"px — ready to save" : "drag to size the box";
  } else if(h){ h.textContent="Drag on the frame to draw the zone box"; }

/* event clip: auto-loop the evidence frames as a short video.
   Slower, readable playback — each frame holds ~0.55s, with a longer pause on the
   last frame before looping so the threat doesn't flash past or snap back jarringly. */
var CLIP_FRAME_MS = 550, CLIP_LOOP_PAUSE_MS = 1200;
function clipPace(){ var n=(state.clipFrames||[]).length;
  return n>10 ? 140 : (n>5 ? 300 : CLIP_FRAME_MS); }   // many frames -> play like video
function clipPaint(i){
  var n=state.clipFrames?state.clipFrames.length:0; if(!n) return;
  var counter=$("clipCounter"); if(counter) counter.textContent=(i+1)+" / "+n;
  var prog=$("clipProg"); if(prog) prog.style.width=Math.round((i+1)/n*100)+"%";
  var prev=state.clipThumb; if(prev!=null){ var pe=$("clipthumb_"+prev); if(pe) pe.classList.remove("on"); }
  var ce=$("clipthumb_"+i); if(ce){ ce.classList.add("on"); if(ce.scrollIntoView) ce.scrollIntoView({block:"nearest",inline:"nearest"}); }
  state.clipThumb=i;
}
function startClip(){ stopClip();
  var fr=state.clipFrames;
  if(!fr||fr.length<2){ return; }
  state.clipIdx=0; state.clipThumb=null;
  var img=$("clipImg"); if(img) img.src=fr[0]; clipPaint(0);
  var per=clipPace();
  function tick(){
    var im=$("clipImg"); if(!im){ stopClip(); return; }
    var wasLast = state.clipIdx >= state.clipFrames.length-1;
    state.clipIdx = wasLast ? 0 : state.clipIdx+1;
    im.src=state.clipFrames[state.clipIdx];
    clipPaint(state.clipIdx);
    var atLast = state.clipIdx===state.clipFrames.length-1;   // brief pause before looping
    state.clipTimer=setTimeout(tick, atLast ? Math.max(per, 700) : per);
  }
  state.clipTimer=setTimeout(tick, per);
}
function stopClip(){ if(state.clipTimer){ clearTimeout(state.clipTimer); state.clipTimer=null; }
  var v=$("clipVideo"); if(v){ try{ v.pause(); }catch(e){} } }
function clipSeek(i){
  var v=$("clipVideo");
  if(v && v.style.display!=="none" && v.duration){                 // video mode: seek to that fraction
    v.currentTime = (i/Math.max(1,(state.clipFrames?state.clipFrames.length:1)))*v.duration; clipPaint(i); return; }
  state.clipIdx=i; var img=$("clipImg"); if(img&&state.clipFrames&&state.clipFrames[i]) img.src=state.clipFrames[i]; clipPaint(i); }
/* Play the event as a smooth IMAGE cine-loop over its full frame set — no video
   codec involved (QtWebEngine can't reliably decode the mp4). Fetch the frames for
   the selected event and cache them so the 3s alert poll doesn't re-download. */
function startClipMedia(){ stopClip(); var a=state.selected; if(!a) return;
  var v=$("clipVideo"); if(v) v.style.display="none";   // never use the <video> element
  state.clipFrames=(a.frames||[]).slice(); state.clipIdx=0; state.clipThumb=null;
  var img=$("clipImg"); if(img&&state.clipFrames[0]) img.src=state.clipFrames[0];
  if(state.clipFrames.length>=2) startClip();           // start with thumbnails, upgrade below
  state.clipCache = state.clipCache||{};
  var key=a.evidence_dir||("id"+a.id);
  function useFrames(frames){
    if(state.selected!==a) return;
    if(frames && frames.length>=2){ state.clipFrames=frames; startClip(); }
  }
  if(key in state.clipCache){ useFrames(state.clipCache[key]); return; }
  call("eventClip",[a.evidence_dir||""],function(r){
    var frames=(r&&r.frames)||null; state.clipCache[key]=frames; useFrames(frames); }); }

  call("testUrl",[u],function(r){ wiz.test=r.error?{error:r.error}:r; $("wzTest").innerHTML=wizTestBox(); }); }
function wizAdd(){ var u=wizBuildUrl(); if(!u){wiz.test={error:"Enter the camera IP first"};$("wzTest").innerHTML=wizTestBox();return;}
  var cam={source:u, config:wiz.site.preset||undefined, concealment:true, video_action:true};
  var nm=($("wzName").value||"").trim(); if(nm) cam.id=nm;
  call("addCamera",[JSON.stringify(cam)],function(r){ if(r&&r.error){alert(r.error);return;} wiz.added=Array.isArray(r)?r:wiz.added; wiz.test=null; renderWizard(); }); }
function wizRemove(id){ call("removeCamera",[id],function(r){ wiz.added=Array.isArray(r)?r:wiz.added; renderWizard(); }); }

function wizVlm(){
  var g=wiz.gate;
  if(!g) return '<h2>Local AI verification</h2><p class="lead">Checking the on-device AI…</p><div class="statusbig"><span class="spin"></span><span>Checking Ollama…</span></div>';
  var dot,title,detail,action="";
  if(g.mode==="live"){ dot="var(--c-live)"; title="TrueSight is ready"; detail="Every alert will be double-checked by TrueSight, the on-device vision AI, before it reaches you. Fully offline."; }
  else if(g.mode==="no-model"){ dot="var(--sev-high)"; title="TrueSight not installed yet"; detail="Ollama is running, but the TrueSight vision model (~3.3 GB) needs to be downloaded once.";
    action = wiz.pull&&wiz.pull.state==="pulling"
      ? '<div style="margin-top:14px"><div class="confbar" style="max-width:none"><div id="wzPullBar" style="width:'+(wiz.pull.percent||0)+'%;background:var(--c-accent)"></div></div><div id="wzPullDetail" class="mono sub" style="margin-top:6px;font-size:11px">'+esc(wiz.pull.detail||"")+' '+(wiz.pull.percent||0)+'%</div></div>'
      : '<button class="btn" style="margin-top:14px" onclick="wizPull()">Download model (3.3 GB)</button> <button class="btn ghost" style="margin-top:14px" onclick="wizCheckGate()">Recheck</button>'; }
  else { dot="var(--sev-crit)"; title="Ollama isn't running"; detail="Argus uses Ollama to run the local AI. Start it (or install it from ollama.com), then recheck. You can continue without it — alerts just won't be AI-verified yet.";
    action='<button class="btn ghost" style="margin-top:14px" onclick="wizCheckGate()">Recheck</button>'; }
  return '<h2>Local AI verification</h2><p class="lead">A vision model runs on this machine and confirms each alert is real — this is what keeps false alarms out.</p>'
    +'<div class="statusbig"><span class="statusdot" style="background:'+dot+'"></span><div><div style="font-weight:700;font-size:15px">'+esc(title)+'</div><div class="mut" style="font-size:13px;margin-top:3px;line-height:1.5">'+esc(detail)+'</div>'+action+'</div></div>';
}
function wizCheckGate(){ wiz.gate=null; renderWizard(); call("gateStatus",[],function(g){ wiz.gate=g.error?{mode:"offline"}:g; renderWizard(); }); }
function wizPull(){ wiz.pull={state:"pulling",percent:0,detail:"starting"}; renderWizard();
  call("pullModel",[],function(){ wizPollPull(); }); }
function wizPollPull(){ call("pullProgress",[],function(p){ wiz.pull=p||wiz.pull;
    if(p&&p.state==="done"){ wizCheckGate(); return; }
    if(p&&p.state==="error"){ renderWizard(); return; }
    var bar=$("wzPullBar"); if(bar){ bar.style.width=((p&&p.percent)||0)+'%'; var d=$("wzPullDetail"); if(d) d.textContent=((p&&p.detail)||"")+' '+((p&&p.percent)||0)+'%'; }
    else renderWizard();
    setTimeout(wizPollPull, 1500); }); }

function wizSite(){
  var notiOpts=NOTIFIERS.map(function(n){return '<option value="'+n[0]+'"'+(wiz.site.notify===n[0]?' selected':'')+'>'+esc(n[1])+'</option>';}).join("");
  var presetOpts=Object.keys(state.presets).map(function(k){return '<option value="'+esc(state.presets[k])+'"'+(wiz.site.preset===state.presets[k]?' selected':'')+'>'+esc(k)+'</option>';}).join("");
  return '<h2>Name your site</h2><p class="lead">A label for this location and where alerts should go. You can fine-tune individual rules later.</p>'
    +'<div class="panel" style="padding:18px">'
    +  '<label class="fld">Site name<input id="wzSiteName" value="'+esc(wiz.site.name)+'" placeholder="e.g. Front Store"></label>'
    +  '<div class="grid2" style="margin-top:14px"><label class="fld">Default threats<select id="wzPreset">'+presetOpts+'</select></label>'
    +  '<label class="fld">Notify me via<select id="wzNotify">'+notiOpts+'</select></label></div>'
    +  '<p class="sub" style="margin:12px 0 0;font-size:11.5px">WhatsApp/Telegram need credentials set on this machine (env vars) — the app will use them if present.</p>'
    +'</div>';
}
function wizSaveSite(){ if($("wzSiteName")) wiz.site.name=($("wzSiteName").value||"").trim()||"My Site";
  if($("wzNotify")) wiz.site.notify=$("wzNotify").value; if($("wzPreset")) wiz.site.preset=$("wzPreset").value; }

function wizDone(){
  var g=wiz.gate||{}; var gateTxt=g.mode==="live"?"TrueSight (on-device)":g.mode==="no-model"?"model not downloaded":"Ollama offline";
  return '<h2>You\'re set up</h2><p class="lead">Argus is ready to watch <b>'+esc(wiz.site.name)+'</b>.</p>'
    +'<div class="panel" style="padding:18px"><div class="row" style="justify-content:space-between"><span class="mut">Cameras</span><b class="mono">'+wiz.added.length+'</b></div>'
    +'<div class="row" style="justify-content:space-between;margin-top:8px"><span class="mut">AI verification</span><b>'+esc(gateTxt)+'</b></div>'
    +'<div class="row" style="justify-content:space-between;margin-top:8px"><span class="mut">Notifications</span><b>'+esc(wiz.site.notify)+'</b></div></div>'
    +'<p class="lead" style="margin-top:16px">Start the detection engine to begin monitoring; confirmed alerts will appear under <b>Alerts</b>.</p>';
}
function wizFinish(){ wizSaveSite();
  call("setSite",[wiz.site.name, wiz.site.notify],function(){
    call("markConfigured",[],function(){ closeWizard(); startApp(); }); }); }

function sendTestAlert(btn){
  var msg=$("testNotifyMsg"); if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
  if(msg){ msg.style.color="var(--c-mut)"; msg.textContent="sending through your configured channel…"; }
  call("sendTestNotification",[],function(r){
    if(btn){ btn.disabled=false; btn.textContent="📲 Send test alert"; }
    if(!msg) return;
    if(r&&r.ok){ msg.style.color="var(--c-live)"; msg.textContent="✓ Sent via "+(r.via||"console")+" — check your device."; }
    else { msg.style.color="var(--sev-crit)"; msg.textContent="✕ "+((r&&r.error)||"failed")+" (via "+((r&&r.via)||"?")+")"; }
  });
}
function wizCheckGateStandalone(){ var el=$("sysGate"); if(el) el.textContent="Checking VLM gate…";
  call("gateStatus",[],function(g){ if(!el) return; if(g.error){el.textContent=g.error;return;}
    var msg = g.mode==="live"?"● Live — TrueSight (on-device verification)":g.mode==="no-model"?"● Ollama up, model not installed — run setup to download":"● Ollama offline — gate falls back to mock";
    el.textContent = msg; }); }

/* ---------- offline / local-only proof (#9) ---------- */
function updateNetBadge(){
  var b=$("netBadge"); if(!b) return;
  var online = (typeof navigator!=="undefined") ? navigator.onLine : true;
  if(online){ b.className="netbadge"; b.textContent="🔒 Local-only";
    b.title="Argus runs entirely on this machine — nothing leaves your network."; }
  else { b.className="netbadge offline"; b.textContent="✓ Offline · still running";
    b.title="Internet is down and Argus is still detecting and verifying — 100% on-device."; }
}
function initNetWatch(){
  updateNetBadge();
  window.addEventListener("online", updateNetBadge);
  window.addEventListener("offline", updateNetBadge);
}
/* ---------- boot ---------- */
function startApp(){ renderNav(); refreshCounts(); refreshMonitor(); startGlobalWatch(); initNetWatch(); render(); }

/* ---------- global alert watch: badge + sound + live-tile flags, any screen ---------- */
function startGlobalWatch(){ if(state.globalTimer) return; state.globalTimer=setInterval(pollAlertsGlobal, 3000); pollAlertsGlobal(); }
function pollAlertsGlobal(){
  call("listEventsLite",[80],function(evs){
    if(!Array.isArray(evs)) return;
    state.latestEvents = evs;
    var pending = evs.filter(function(e){return e.review==="new";}).length;
    state.pending = pending;
    if($("stPending")) $("stPending").textContent = pending;
    renderNav();
    maybeChime(evs);
    if(state.route==="live") updateLiveAlertTiles();
    if(state.route==="map") updateMapPins();
  });
}
function maybeChime(evs){
  var maxId=0; evs.forEach(function(e){ if((e.id||0)>maxId) maxId=e.id; });
  if(state.lastSeenId===undefined){ state.lastSeenId=maxId; return; }   // first poll: don't chime the backlog
  if(maxId>state.lastSeenId){ state.lastSeenId=maxId; playChime(); }
}
function playChime(){
  try{
    if(!state.audioCtx) state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=state.audioCtx; if(ctx.state==="suspended") ctx.resume();
    var now=ctx.currentTime;
    // clean two-note notification (A5 -> D6), soft attack, quick decay
    [[880,0.0],[1174.66,0.13]].forEach(function(p){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=p[0];
      var t=now+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}
// browsers gate audio until a user gesture — unlock on first click
document.addEventListener("click", function _unlock(){
  try{ if(!state.audioCtx) state.audioCtx=new (window.AudioContext||window.webkitAudioContext)(); state.audioCtx.resume(); }catch(e){}
  document.removeEventListener("click", _unlock);
});
function boot(){
  call("setupState",[],function(s){
    if(s && !s.error && !s.configured){ openWizard(); }
    else { if(s && s.demo){ state.route="live"; } startApp(); }
  });
}
function connect(tries){
  if(window.qt && qt.webChannelTransport && window.QWebChannel){
    new QWebChannel(qt.webChannelTransport, function(ch){ backend = ch.objects.backend; boot(); });
    return;
  }
  if(tries>0){ setTimeout(function(){connect(tries-1);}, 60); return; }
  document.getElementById("screen").innerHTML='<div class="pad mut">Backend bridge not found. Run this via <b>cvti-console</b> / <b>python -m cvti.app.shell</b> — not a plain browser.</div>';
  renderNav();
}
if(document.readyState!=="loading") connect(30);
else document.addEventListener("DOMContentLoaded", function(){connect(30);});
</script>
