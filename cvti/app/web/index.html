}

/* ---------- Rules (threats per camera) ---------- */
/* [key, label, tooltip, defaultOn, group, icon] — icons match the alert threat
   classes so a chip here reads the same as the alert it produces. */
var DETECTORS=[
  ["concealment","Concealment","Shoplifting — an item hidden on the body",true,"security","🛍"],
  ["video_action","Video theft","Fine-tuned AI reads the action itself (VideoMAE)",true,"security","🎞"],
  ["violence","Violence","Fighting or assault between people",false,"security","🥊"],
  ["weapons","Weapons","A gun or knife visible in frame",false,"security","🔪"],
  ["theft","Zone theft","Takes an item and leaves a defined zone",false,"security","📦"],
  ["tamper","Camera block","Lens covered, sprayed, defocused or blacked out",false,"security","🚫"],
  ["fire_smoke","Fire & smoke","Visible flame or smoke — an HSE emergency",false,"safety","🔥"],
  ["running","Panic running","People suddenly running — panic or evacuation",false,"safety","🏃"],
  ["crowd_formation","Crowd forming","A tight crowd that can block exits or movement",false,"safety","👥"],
  ["fall","Person down","Someone collapsed on the ground — medical emergency",false,"safety","🩹"]
];
var DET_GROUPS=[["security","Security","Theft, violence & intrusion"],
                ["safety","Safety / HSE","Fire, panic, crowding & medical"]];
/* Static-for-the-session data: fetching it on every render made each tab
   switch pay avoidable QWebChannel round-trips. (26 Aug.) */
function once(key, method, cb){
  state.onceCache = state.onceCache || {};
  if(key in state.onceCache){ cb(state.onceCache[key]); return; }
  call(method,[],function(r){ state.onceCache[key] = r; cb(r); });
}
function renderRules(){
  once("presets","presets",function(pr){ state.presets = (pr&&!pr.error)?pr:{}; });
  call("listCameras",[],function(cams){
    cams = Array.isArray(cams)?cams:[];
    var presetOpts = Object.keys(state.presets||{}).map(function(k){return '<option value="'+esc(state.presets[k])+'">'+esc(k)+'</option>';}).join("");
    if(!cams.length){
      $("screen").innerHTML='<div class="pad"><h2>Rules</h2><p class="mut">No cameras yet. Add cameras first, then choose what each one watches for.</p></div>';
      return;
    }
    var cards = cams.map(function(c){
      // chips grouped Security / Safety, each group showing how many are live
      var dets = DET_GROUPS.map(function(g){
        var inGroup = DETECTORS.filter(function(d){ return d[4]===g[0]; });
        var onCount = inGroup.filter(function(d){ return !!c[d[0]]; }).length;
        var chips = inGroup.map(function(d){
          var on = !!c[d[0]];
          return '<button class="detchip'+(on?" on":"")+'" data-det="'+d[0]+'" '
            +'onclick="toggleRule(\''+esc(c.id)+'\',\''+d[0]+'\',this)" title="'+esc(d[2])+'">'
            +'<span class="di">'+d[5]+'</span><span class="dl">'+esc(d[1])+valBadge(d[0])+'</span>'
            +'<span class="dt">'+(on?"●":"○")+'</span></button>';
        }).join("");
        return '<div class="detgroup"><div class="detghead"><b>'+esc(g[1])+'</b>'
          +'<span class="mut">'+esc(g[2])+'</span>'
          +'<span class="detgcount'+(onCount?" on":"")+'">'+onCount+'/'+inGroup.length+'</span></div>'
          +'<div class="detrow">'+chips+'</div></div>';
      }).join("");
      var native = DETECTORS.filter(function(d){return c[d[0]];}).length;
      var customs = (c.custom_threats||[]);
      var customList = customs.length ? customs.map(function(t,i){
        return '<div class="customthreat"><div style="min-width:0"><b>'+esc(t.name)+'</b> <span class="mut">'+esc(t.description)+'</span></div>'
          +'<button class="chip" onclick="removeCustom(\''+esc(c.id)+'\','+i+')">remove</button></div>';
      }).join("") : '<div class="mut" style="font-size:12px">None yet — add what matters for this place.</div>';
      (state.camConfigs=state.camConfigs||{})[c.id]=c;
      return '<div class="panel rulecard"><div class="row" style="justify-content:space-between">'
        +'<div class="row" style="gap:8px"><span class="dot" style="background:var(--c-live)"></span><b class="mono" style="font-size:14px">'+esc(c.id)+'</b>'
        +'<span class="mono mut" style="font-size:11px">'+esc((c.source||"").split("/").pop().split("@").pop())+'</span></div>'
        +'<span class="mut rcount" style="font-size:12px">'+(native+customs.length)+' threat'+((native+customs.length)===1?"":"s")+' watched</span></div>'
        +'<div class="scenemap" id="scene-'+esc(c.id)+'"><span class="mut">reading scene…</span></div>'
        +'<div class="syslabel" style="margin-top:12px">Built-in detectors</div>'
        +dets
        +'<div class="row" style="margin-top:10px;gap:8px"><span class="mut" style="font-size:12px">rule set</span>'
        +'<select onchange="setRulePreset(\''+esc(c.id)+'\',this.value)">'+presetOpts+'</select></div>'
        +'<div class="syslabel" style="margin-top:16px">Your own rules — in plain English, for this place</div>'
        +'<div style="margin-top:8px">'+customList+'</div>'
        +'<div class="row" style="margin-top:10px;gap:8px"><input id="ctn-'+esc(c.id)+'" placeholder="name e.g. counter-jump" style="width:170px">'
        +'<input id="ctd-'+esc(c.id)+'" placeholder="describe: e.g. someone climbing over the counter" style="flex:1;min-width:220px">'
        +'<button class="btn sm" onclick="addCustom(\''+esc(c.id)+'\')">Add</button></div>'
        +'<div class="syslabel" style="margin-top:16px">Zones — draw an area to watch (loitering / restricted)</div>'
        +'<div id="zones-'+esc(c.id)+'" style="margin-top:6px"><span class="mut" style="font-size:12px">loading…</span></div>'
        +'<div class="row" style="margin-top:9px"><button class="btn ghost sm" onclick="openZoneEditor(\''+esc(c.id)+'\')">✏️ Draw a zone</button></div>'
        +'<div style="margin-top:13px;padding-top:11px;border-top:1px solid var(--c-border)">'
        +  '<div class="plabel" style="color:var(--c-accent)">DESCRIBE IT IN ENGLISH <span class="valbadge exp">EXPERIMENTAL</span></div>'
        +  customRuleRows(c)
        +  '<div class="row" style="gap:8px;margin-top:8px">'
        +    '<input id="cr-'+esc(c.id)+'" placeholder="e.g. Is any person wearing a black hoodie?" style="flex:1;font-size:12.5px">'
        +    '<button class="btn sm" onclick="addCustomRule(\''+esc(c.id)+'\', this)">+ Watch for this</button></div>'
        +  '<div id="crmsg-'+esc(c.id)+'" class="sub" style="font-size:11.5px;margin-top:6px">Sentences add up — TrueSight scans this camera for each of them about every 12 seconds, person in frame or not. New sentences go live within one scan.</div>'
        +'</div></div>';
    }).join("");
    $("screen").innerHTML='<div class="pad"><div class="row" style="justify-content:space-between;margin-bottom:6px">'
      +'<h2 style="margin:0">Rules</h2><span class="mut" style="font-size:12px">what each camera watches for</span></div>'
      +'<p class="mut" style="margin:0 0 14px">Toggle built-in detectors, or write your own threats in plain English — the local AI checks them in this camera\'s scene. Changes apply on the next <b>Start monitoring</b>.</p>'
      +cards+'</div>';
    cams.forEach(function(c){ fillScene(c.id); fillZones(c.id); });
  });
}
function fillZones(camId){
  call("listZones",[camId],function(zs){
    var el=$("zones-"+camId); if(!el) return;
    zs = Array.isArray(zs)?zs:[];
    el.innerHTML = zs.length ? zs.map(function(z){
      return '<div class="customthreat"><div><b>'+esc(z.name)+'</b> <span class="mut">loiter &gt; '+esc(z.dwell_alert_seconds||5)+'s · '+(z.polygon||[]).length+' points</span></div>'
        +'<button class="chip" onclick="removeZone(\''+esc(camId)+'\',\''+esc(z.name)+'\')">remove</button></div>';
    }).join("") : '<div class="mut" style="font-size:12px">No zones yet — draw one to watch a shelf, entrance, or restricted area.</div>';
  });
}
function removeZone(camId, name){ call("removeZone",[camId,name],function(){ fillZones(camId); }); }
/* ---- zone drawing modal (click points on a camera frame) ---- */
function openZoneEditor(camId){
  var m=$("zoneModal"); if(!m){ m=document.createElement("div"); m.id="zoneModal"; (document.getElementById("modalRoot")||document.body).appendChild(m); }
  m.className="zonemodal"; m.innerHTML='<div class="zonemodal-inner"><div class="zmhead"><b>Draw a zone · '+esc(camId)+'</b>'
    +'<button class="lmclose" style="position:static" onclick="closeZoneEditor()">✕</button></div>'
    +'<div class="zmbody"><div class="mut">loading camera frame…</div></div></div>';
  m.onclick=function(e){ if(e.target===m) closeZoneEditor(); };
  call("cameraSnapshot",[camId],function(s){
    if(!s || s.error || !s.uri){ var b=m.querySelector(".zmbody"); if(b) b.innerHTML='<div class="mut">Could not read a frame from this camera'+(s&&s.error?': '+esc(s.error):'')+'.</div>'; return; }
    state.zone={camId:camId, pts:[], snapW:s.w, snapH:s.h};
    var dispW=Math.min(720, s.w), dispH=Math.round(dispW*s.h/s.w);
    state.zone.dispW=dispW; state.zone.dispH=dispH;
    var b=m.querySelector(".zmbody");
    b.innerHTML='<div class="zmcanvaswrap" style="width:'+dispW+'px;height:'+dispH+'px">'
      +'<img src="'+s.uri+'" style="width:'+dispW+'px;height:'+dispH+'px">'
      +'<canvas id="zmcanvas" width="'+dispW+'" height="'+dispH+'"></canvas></div>'
      +'<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">'
      +'<input id="zmname" placeholder="zone name e.g. entrance" style="width:190px">'
      +'<span class="mut" style="font-size:12px">loiter &gt;</span><input id="zmdwell" type="number" value="5" min="1" style="width:70px"><span class="mut" style="font-size:12px">sec</span>'
      +'<span style="flex:1"></span><span id="zmhint" class="mut" style="font-size:12px">Drag on the frame to draw the zone box</span>'
      +'<button class="btn ghost sm" onclick="zoneClear()">Clear</button>'
      +'<button class="btn sm" onclick="zoneSave()">Save zone</button></div>';
    var cv=$("zmcanvas");
    function pos(e){ var r=cv.getBoundingClientRect();
      return [Math.max(0,Math.min(cv.width,Math.round(e.clientX-r.left))), Math.max(0,Math.min(cv.height,Math.round(e.clientY-r.top)))]; }
    cv.addEventListener("mousedown", function(e){ var p=pos(e); state.zone.box={x0:p[0],y0:p[1],x1:p[0],y1:p[1]}; state.zone.drag=true; zoneRedraw(); });
    cv.addEventListener("mousemove", function(e){ if(!state.zone||!state.zone.drag) return; var p=pos(e); state.zone.box.x1=p[0]; state.zone.box.y1=p[1]; zoneRedraw(); });
    window.addEventListener("mouseup", function(){ if(state.zone) state.zone.drag=false; });
    zoneRedraw();
  });
}
function zoneRedraw(){
  var cv=$("zmcanvas"); if(!cv) return; var ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);
  var b=state.zone&&state.zone.box, h=$("zmhint");
  if(b){
    var x=Math.min(b.x0,b.x1), y=Math.min(b.y0,b.y1), w=Math.abs(b.x1-b.x0), hh=Math.abs(b.y1-b.y0);
    ctx.fillStyle="rgba(54,160,218,0.22)"; ctx.strokeStyle="#36a0da"; ctx.lineWidth=2;
    ctx.fillRect(x,y,w,hh); ctx.strokeRect(x,y,w,hh);
    [[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]].forEach(function(c){ ctx.beginPath(); ctx.arc(c[0],c[1],4,0,6.28);
      ctx.fillStyle="#36a0da"; ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke(); });
    if(h) h.textContent = (w>4&&hh>4) ? Math.round(w)+"×"+Math.round(hh)+"px — ready to save" : "drag to size the box";
  } else if(h){ h.textContent="Drag on the frame to draw the zone box"; }
}
function zoneClear(){ if(state.zone){ state.zone.box=null; zoneRedraw(); } }
function zoneSave(){
  var z=state.zone, b=z&&z.box;
  if(!b || Math.abs(b.x1-b.x0)<5 || Math.abs(b.y1-b.y0)<5){ var h=$("zmhint"); if(h) h.textContent="drag a box on the frame first"; return; }
  var name=($("zmname")||{}).value||"", dwell=parseFloat(($("zmdwell")||{}).value||"5")||5;
  if(!name.trim()){ var h2=$("zmhint"); if(h2) h2.textContent="give the zone a name"; return; }
  var x0=Math.min(b.x0,b.x1), y0=Math.min(b.y0,b.y1), x1=Math.max(b.x0,b.x1), y1=Math.max(b.y0,b.y1);
  var sx=z.snapW/z.dispW, sy=z.snapH/z.dispH;   // display -> ORIGINAL pixels; box -> 4 corners
  var orig=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(function(pt){ return [Math.round(pt[0]*sx), Math.round(pt[1]*sy)]; });
  call("addZone",[z.camId, name.trim(), JSON.stringify(orig), dwell],function(r){
    if(r&&r.error){ var h=$("zmhint"); if(h) h.textContent=r.error; return; }
    closeZoneEditor(); fillZones(z.camId);
  });
}
function closeZoneEditor(){ state.zone=null; var m=$("zoneModal"); if(m) m.remove(); }
var SCENE_ENVIRONMENTS=["estate_gate","estate_street","perimeter_fence","retail_shop","mall_corridor",
  "office_lobby","office_floor","parking_lot","banking_hall","atm_area","warehouse_floor",
  "generator_area","residential_interior","residential_exterior","unknown"];
/* Scene hints at onboarding: the person adding the camera knows what it
   watches — the AI mapper uses their answers as priors instead of guessing
   from one frame. Optional on purpose; empty fields add nothing. */
function sceneHintFields(prefix){
  var envOpts='<option value="">environment (optional)</option>'+SCENE_ENVIRONMENTS.filter(function(e){return e!=="unknown";})
    .map(function(e){return '<option value="'+e+'">'+esc(e.replace(/_/g," "))+'</option>';}).join("");
  return '<div class="row" style="margin-top:10px;gap:8px" title="Optional — helps the AI understand this camera\'s scene">'
    +'<select id="'+prefix+'SceneEnv" style="width:180px">'+envOpts+'</select>'
    +'<input id="'+prefix+'SceneActors" placeholder="who belongs here e.g. staff, customers" style="flex:1;min-width:160px">'
    +'<input id="'+prefix+'SceneNote" placeholder="anything else e.g. cars park along the left" style="flex:1;min-width:160px"></div>';
}
function sceneHintValues(prefix){
  var out={};
  var env=($(prefix+"SceneEnv")||{}).value||""; if(env) out.environment_type=env;
  var actors=(($(prefix+"SceneActors")||{}).value||"").split(",").map(function(v){return v.trim();}).filter(Boolean);
  if(actors.length) out.expected_actors=actors;
  var note=(($(prefix+"SceneNote")||{}).value||"").trim(); if(note) out.scene_hint=note;
  return out;
}
function sceneHintSummary(cam){
  if(!cam) return "";
  var bits=[];
  if(cam.environment_type && cam.environment_type!=="unknown") bits.push(cam.environment_type.replace(/_/g," "));
  if(cam.expected_actors && cam.expected_actors.length) bits.push("expects "+cam.expected_actors.join(", "));
  if(cam.scene_hint) bits.push(cam.scene_hint);
  return bits.join(" · ");
}
function sceneCanEdit(){
  if(!state.auth || !state.auth.permissions) return true;
  return state.auth.permissions.indexOf("configure_cameras")>=0;
}
function sceneStatusText(mapping){
  var status=(mapping&&mapping.status)||"pending";
  return ({ready_reviewed:"reviewed",ready_unreviewed:"needs review",pending:"mapping pending",
    stale:"remap requested",failed:"mapping failed"})[status]||status.replace(/_/g," ");
}
function renderSceneMapper(camId, s){
  var mapping=(s&&s.mapping)||{status:"pending"}, status=mapping.status||"pending";
  var statusClass=status==="ready_reviewed"?" reviewed":((status==="failed"||status==="stale")?" "+status:"");
  var canEdit=sceneCanEdit(), disabled=canEdit?"":" disabled";
  var head='<div class="scenemap-head"><b style="font-size:12px">Scene context</b>'
    +'<span class="mapping-status'+statusClass+'">'+esc(sceneStatusText(mapping))+'</span>'
    +'<span class="mut" style="font-size:10.5px">'+esc(mapping.provenance||"")+'</span></div>';
  if(!s || s.error || !s.scene_description){
    var error=(s&&s.error)||(mapping&&mapping.error)||"No mapped scene is available.";
    // Not dead air: while mapping is pending, show what the operator already
    // told us at onboarding — the AI refines these on the first start.
    var hints=sceneHintSummary((state.camConfigs||{})[camId]);
    var hintRow=hints?'<div class="mut" style="margin-top:7px;font-size:12px">Your notes: '+esc(hints)
      +' <span style="font-size:11px">— the AI maps the scene from these on the first monitoring start.</span></div>':"";
    return head+'<div class="row" style="margin-top:9px;gap:9px"><span class="mut" style="font-size:12px">'+esc(error)+'</span>'
      +(canEdit?'<button class="btn ghost sm" onclick="remapScene(\''+esc(camId)+'\')">Remap</button>':"")+'</div>'+hintRow;
  }
  var envOptions=SCENE_ENVIRONMENTS.map(function(env){return '<option value="'+env+'"'+(env===s.environment_type?' selected':'')+'>'+esc(env.replace(/_/g," "))+'</option>';}).join("");
  var actors=(s.expected_actors||[]).join(", ");
  var frame=s.source_frame_uri?'<img class="scene-frame" src="'+s.source_frame_uri+'" alt="Representative scene frame">':'<div class="scene-frame row" style="justify-content:center"><span class="mut">no frame</span></div>';
  var suggestions=(s.zones||[]).map(function(zone){
    var actions=canEdit?'<span style="margin-left:auto"></span><button class="btn ghost sm" onclick="acceptSceneZone(\''+esc(camId)+'\',\''+esc(zone.id)+'\',this)">Accept</button>'
      +'<button class="chip" onclick="ignoreSceneZone(this)">Ignore</button>':"";
    return '<div class="scene-suggestion"><span class="envtag">'+esc(zone.role||"zone")+'</span><b>'+esc(zone.label||zone.id)+'</b>'+actions+'</div>';
  }).join("");
  return head+'<div class="scenemap-grid">'+frame+'<div><div class="scene-fields">'
    +'<label>Environment<select id="scene-env-'+esc(camId)+'"'+disabled+'>'+envOptions+'</select></label>'
    +'<label>Expected actors<input id="scene-actors-'+esc(camId)+'" value="'+esc(actors)+'"'+disabled+'></label>'
    +'<label class="wide">Description<textarea id="scene-desc-'+esc(camId)+'"'+disabled+'>'+esc(s.scene_description)+'</textarea></label>'
    +'</div><div class="row" style="margin-top:7px;gap:8px"><span class="mut" style="font-size:10.5px">confidence</span><span class="mono" style="font-size:11px">'+esc(Number(s.confidence||0).toFixed(2))+'</span></div>'
    +(suggestions?'<div class="scene-suggestions">'+suggestions+'</div>':"")
    +(canEdit?'<div class="scene-actions"><button class="btn ghost sm" onclick="saveSceneContext(\''+esc(camId)+'\',false)">Save</button>'
      +'<button class="btn sm" onclick="saveSceneContext(\''+esc(camId)+'\',true)">Approve</button>'
      +'<button class="btn ghost sm" onclick="remapScene(\''+esc(camId)+'\')">Remap</button>'
      +'<span id="scene-msg-'+esc(camId)+'" class="mut" style="font-size:11px"></span></div>':"")
    +'</div></div>';
}
function fillScene(camId){
  call("sceneContext",[camId],function(s){
    var el=$("scene-"+camId); if(!el) return;
    state.sceneContexts[camId]=(s&&!s.error)?s:null;
    el.innerHTML=renderSceneMapper(camId,s);
  });
}
function scenePayload(camId){
  var source=state.sceneContexts[camId]||{}, payload={};
  ["camera_id","source_type","environment_type","scene_description","expected_actors","zones","confidence","generated_at","source_frame_path","notes"].forEach(function(k){if(k in source) payload[k]=source[k];});
  payload.environment_type=($("scene-env-"+camId)||{}).value||source.environment_type||"unknown";
  payload.scene_description=($("scene-desc-"+camId)||{}).value||source.scene_description||"";
  payload.expected_actors=(($("scene-actors-"+camId)||{}).value||"").split(",").map(function(v){return v.trim();}).filter(Boolean);
  return payload;
}
function saveSceneContext(camId, approve){
  var method=approve?"approveSceneContext":"updateSceneContext", msg=$("scene-msg-"+camId);
  if(msg) msg.textContent=approve?"approving…":"saving…";
  call(method,[camId,JSON.stringify(scenePayload(camId))],function(r){
    if(r&&r.error){if(msg) msg.textContent=r.error;return;}
    state.sceneContexts[camId]=r.context; var el=$("scene-"+camId);
    if(el) el.innerHTML=renderSceneMapper(camId,r.context);
  });
}
function remapScene(camId){
  call("requestSceneRemap",[camId],function(r){
    var current=state.sceneContexts[camId]||{};
    if(r&&r.error){var msg=$("scene-msg-"+camId);if(msg)msg.textContent=r.error;return;}
    current.mapping=r.mapping||{status:"stale"}; state.sceneContexts[camId]=current;
    var el=$("scene-"+camId); if(el) el.innerHTML=renderSceneMapper(camId,current);
  });
}
function acceptSceneZone(camId, zoneId, button){
  if(button) button.disabled=true;
  call("acceptSuggestedZone",[camId,zoneId,5],function(r){
    if(r&&r.error){if(button){button.disabled=false;button.textContent=r.error;}return;}
    var row=button&&button.closest(".scene-suggestion"); if(row) row.remove(); fillZones(camId);
  });
}
function ignoreSceneZone(button){var row=button&&button.closest(".scene-suggestion");if(row)row.remove();}
function addCustom(camId){
  var n=($("ctn-"+camId)||{}).value||"", d=($("ctd-"+camId)||{}).value||"";
  if(!d.trim()) return;
  call("addCustomThreat",[camId, n.trim(), d.trim()],function(r){ renderRules(); });
}
function removeCustom(camId, i){ call("removeCustomThreat",[camId, i],function(){ renderRules(); }); }
function toggleRule(camId, det, btn){
  if(!btn) return;
  var next = !btn.classList.contains("on");
  // instant, accurate: flip only the clicked chip (no full re-render)
  btn.classList.toggle("on", next);
  var dt = btn.querySelector(".dt"); if(dt) dt.textContent = next ? "●" : "○";
  var card = btn.closest(".rulecard");

/* Threat class -> label / colour / icon, so alerts can be grouped and colour-coded

var THREAT_CLASS = [
  [/theft|conceal|shoplift|video_theft/i, "Theft",     "#f59e0b", "🛍"],
  [/fire|smoke/i,                          "Fire",      "#ef4444", "🔥"],
  [/violence|assault|fight/i,              "Violence",  "#dc2626", "🥊"],
  [/weapon|gun|knife/i,                    "Weapon",    "#b91c1c", "🔪"],
  [/loiter|presence/i,                     "Loitering", "#8b5cf6", "🚶"],
  [/run|panic/i,                           "Panic",     "#fb7185", "🏃"],
  [/crowd|stampede/i,                      "Crowd",     "#eab308", "👥"],
  [/fall|collapse|person_down/i,           "Fall",      "#06b6d4", "🩹"],
  [/tamper|block/i,                        "Tamper",    "#94a3b8", "🚫"]
];
function threatClass(rule){ rule=String(rule||"");
  for(var i=0;i<THREAT_CLASS.length;i++){ if(THREAT_CLASS[i][0].test(rule))
    return {label:THREAT_CLASS[i][1], color:THREAT_CLASS[i][2], icon:THREAT_CLASS[i][3]}; }

}

   (the list used to carry ~189 MB of base64 through the channel — that was
   the slow tab switch). Cached per evidence dir; the 3s poll never refetches. */
function ensureFrames(a, cb){
  if(!a){ cb([]); return; }
  if(a.frames && a.frames.length){ cb(a.frames); return; }
  state.clipCache = state.clipCache || {};
  var key = a.evidence_dir || ("id"+a.id);
  /* Cache the WHOLE evidence record. It used to keep only the frames, so the
     first view of an alert showed the boxed subject shot and every later view
     lost it: each list refresh mints new row objects, the cache hit restored
     frames alone, and the box quietly vanished ('it should and used to be
     there', 29 Aug — mid-demo).  */
  if(key in state.clipCache){
    var cached = state.clipCache[key] || {};
    a.frames = cached.frames || [];
    if(cached.subject) a.subject = cached.subject;
    if(cached.fps) a.clipFps = cached.fps;
    cb(a.frames); return;
  }
  call("eventClip",[a.evidence_dir||""],function(r){
    var frames = (r && r.frames) || [];
    state.clipCache[key] = {frames: frames, subject: (r && r.subject) || null,
                            fps: (r && r.fps) || null};
    a.frames = frames;
    if(r && r.subject) a.subject = r.subject;   // the WHO shot rides with it
    if(r && r.fps) a.clipFps = r.fps;
    cb(frames);
  });
}

function startClipMedia(){ stopClip(); var a=state.selected; if(!a) return;
  var v=$("clipVideo"); if(v) v.style.display="none";   // never use the <video> element
  state.clipFrames=(a.frames||[]).slice(); state.clipIdx=0; state.clipThumb=null;
  var img=$("clipImg"); if(img&&state.clipFrames[0]) img.src=state.clipFrames[0];
  if(state.clipFrames.length>=2) startClip();           // start with thumbnails, upgrade below
  state.clipCache = state.clipCache||{};
  var key=a.evidence_dir||("id"+a.id);
  function useFrames(frames){
    if(state.selected!==a) return;
    if(frames && frames.length>=2){ state.clipFrames=frames; startClip(); }
  }
  // Same cache as ensureFrames — same record shape, or the two poison each other.
  if(key in state.clipCache){ useFrames((state.clipCache[key]||{}).frames); return; }
  call("eventClip",[a.evidence_dir||""],function(r){
    var frames=(r&&r.frames)||null;
    state.clipCache[key]={frames: frames, subject: (r&&r.subject)||null};
    useFrames(frames); }); }

function prepareVerifier(){

function pollGateHealth(){

function maybeChime(evs){
  var maxId=0; evs.forEach(function(e){ if((e.id||0)>maxId) maxId=e.id; });
  if(state.lastSeenId===undefined){ state.lastSeenId=maxId; return; }   // first poll: don't chime the backlog
  if(maxId>state.lastSeenId){ state.lastSeenId=maxId; playChime(); }
}
function playChime(){
  try{
    if(!state.audioCtx) state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=state.audioCtx; if(ctx.state==="suspended") ctx.resume();
    var now=ctx.currentTime;
    // clean two-note notification (A5 -> D6), soft attack, quick decay
    [[880,0.0],[1174.66,0.13]].forEach(function(p){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=p[0];
      var t=now+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}

});

    authScreen(head+'<div class="panel" style="padding:20px;margin-top:10px">'+body+'</div>'
      +'<div class="sub" style="font-size:11.5px;margin-top:12px;text-align:center">'
      +  '<a href="#" style="color:var(--c-accent);text-decoration:none" onclick="showAuthRecovery();return false">Can\'t sign in?</a>'
      +'</div>'
      +'<div id="authRecover" style="display:none"></div>');
    if(state.authConfigured!==false){ wireAuthEnter("doSignIn"); $("authUser").focus(); }
    return;
  }
  // create
  if(state.authConfigured){
    /* Pilot-phase decision, reaffirmed 28 Aug ("for now when we do create
       account just override it"): the create tab on a configured site shows
       WHO already holds it and lets a new owner REPLACE those accounts,
       confirmed and loudly audited. Signed-in owners still add people the
       normal way under Settings → People. */
    call("authAccounts",[],function(r){
      var users=(r&&r.users)||[];
      var who=users.length
        ? '<div class="panel" style="padding:12px 16px;margin:0 0 12px;font-size:12.5px;line-height:1.7"><b>This site already has '+users.length+' account'+(users.length>1?"s":"")+':</b> '
          +users.map(function(u){return esc(u.username)+' <span class="mut">('+esc(u.role)+')</span>';}).join(", ")+'</div>'
        : '';
      authScreen(head+'<div class="panel" style="padding:20px;margin-top:10px">'
        +who
        +'<p class="mut" style="font-size:12.5px;line-height:1.6;margin:0 0 6px">Creating an account here <b style="color:var(--sev-high)">replaces every account above</b> with a new owner. Alerts, evidence and the audit trail are kept — and this replacement is written to the audit log with the old names.</p>'
        +authField("authUser","New owner name","text","")
        +authField("authPass","Password","password","At least 8 characters.")
        +'<div class="ferr" id="authErr"></div>'
        +'<button class="btn" id="authBtn" style="width:100%;padding:11px;background:var(--sev-high);border-color:var(--sev-high);color:#04121f" onclick="doOwnerOverride()">Replace accounts and continue</button>'
        +'</div>');
      wireAuthEnter("doOwnerOverride"); $("authUser").focus();
    });
    return;
  }
  authScreen(head+'<div class="panel" style="padding:20px;margin-top:10px">'
    +  '<div style="font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-sub)">Step 1 of 5 · Owner account</div>'
    +  '<p class="mut" style="font-size:12.5px;margin:9px 0 3px;line-height:1.55">Nothing ships with a password, so there is nothing to change — you are creating the first account now. The owner can add operators and installers later.</p>'
    +  authField("authUser","Name","text","")
    +  authField("authPass","Password","password","At least 8 characters. Stored hashed — it cannot be recovered, only reset.")
    +  '<div class="ferr" id="authErr">'+esc(err||"")+'</div>'
    +  '<button class="btn" id="authBtn" style="width:100%;padding:11px;background:var(--c-accent);border-color:var(--c-accent);color:#04121f" onclick="doFirstRun()">Create account and continue</button>'
    +'</div>'
    +'<div class="authdots"><div class="on"></div><div></div><div></div><div></div><div></div></div>'
    +'<div class="sub" style="font-size:11px;margin-top:8px">Then: cameras → zones → what to watch for → a test alert to your phone</div>');
  wireAuthEnter("doFirstRun"); $("authUser").focus();
}
function showAuthRecovery(){
  call("authRecovery",[],function(r){
    var el=$("authRecover"); if(!el) return;
    el.style.display="block";
    el.innerHTML = '<div class="panel" style="padding:14px 16px;margin-top:10px;font-size:12.5px;line-height:1.6">'
      +'<b>Accounts on this site are local</b> — there is no default login and no reset email.'
      +'<div class="mut" style="margin-top:8px">If nobody knows the password, someone with access to <i>this machine\'s files</i> can reset accounts:</div>'
      +'<ol class="mut" style="margin:8px 0 0 18px;padding:0">'
      +'<li>Quit Argus</li>'
      +'<li>Delete this file:<div class="mono" style="font-size:11px;margin:4px 0;word-break:break-all;user-select:all">'+esc((r&&r.auth_db)||"")+'</div></li>'
      +'<li>Start Argus again — it will ask you to create a new owner account</li>'
      +'</ol>'
      +'<div class="mut" style="margin-top:8px">Recorded alerts, evidence and the audit trail are separate files and are not touched. This view was written to the audit log.</div>'
      +'</div>';
  });
}
function wireAuthEnter(fn){
  ["authUser","authPass"].forEach(function(id){
    var el=$(id); if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter") window[fn](); });
  });
}
function authBusy(b){ var btn=$("authBtn"); if(btn){ btn.disabled=b; } }
function doSignIn(){
  authBusy(true);
  call("signIn",[$("authUser").value.trim(), $("authPass").value],function(r){
    authBusy(false);
    if(r && r.ok){ enterApp(r); }
    // The backend returns one message for a wrong password and an unknown
    // user, on purpose. Display it verbatim; never elaborate.
    else if($("authErr")) $("authErr").textContent = (r&&r.error)||"sign-in failed";
  });
}
function doOwnerOverride(){
  var n=$("authUser").value.trim();
  if(!confirm("Replace ALL existing accounts with a new owner '"+n+"'?\n\nThis cannot be undone. Alerts, evidence and the audit log are kept.")) return;
  authBusy(true);
  call("createOwnerOverride",[n, $("authPass").value],function(r){
    authBusy(false);
    if(r && r.ok){ enterApp(r); }
    else if($("authErr")) $("authErr").textContent = (r&&r.error)||"could not replace accounts";
  });
}
function doFirstRun(){
  authBusy(true);
  call("createFirstOwner",[$("authUser").value.trim(), $("authPass").value],function(r){
    authBusy(false);
    if(r && r.ok){ enterApp(r); }
    else if($("authErr")) $("authErr").textContent = (r&&r.error)||"could not create the account";
  });
}
function doSignOut(){
  // Reload rather than unwind: every poller and cached screen assumed a
  // session, and a fresh boot() is the one state we can trust.
  call("signOut",[],function(){ location.reload(); });
}
/* Nav items the signed-in role cannot use are not rendered. The backend
   re-checks every call regardless — this is courtesy, not enforcement. */
var NAV_PERMS = {watch:"view_live", triage:"view_alerts",
                 configure:"configure_cameras",
                 value:"configure_site", settings:"configure_site"};
function navAllowed(key){
  if(!state.auth || !state.auth.permissions) return true;
  var need = NAV_PERMS[key];
  return !need || state.auth.permissions.indexOf(need) >= 0;
}
function enterApp(a){
  state.auth = a;
  var g=$("authGate"); g.className=""; g.innerHTML="";
  var who=$("whoami");
  if(who){ who.style.display="block"; $("whoamiName").textContent = a.username+" · "+a.role; }
  if(a.landing && navAllowed(a.landing)) state.route = a.landing;
  call("setupState",[],function(s){
    if(s && !s.error && !s.configured){ openWizard(); }
    else { if(s && s.demo){ state.route="watch"; state.watchTab="grid"; } }
    startApp();
  });
}
function connect(tries){
  if(window.qt && qt.webChannelTransport && window.QWebChannel){
    new QWebChannel(qt.webChannelTransport, function(ch){ backend = ch.objects.backend; boot(); });
    return;
  }
  if(tries>0){ setTimeout(function(){connect(tries-1);}, 60); return; }
  authScreen('<div class="brand-n">Argus</div><div class="mut" style="margin-top:10px">'
    +'Backend bridge not found. Run this via <b>cvti-console</b> / <b>python -m cvti.app.shell</b> — not a plain browser.</div>');
}
if(document.readyState!=="loading") connect(30);
else document.addEventListener("DOMContentLoaded", function(){connect(30);});
</script>
</body>
</html>
